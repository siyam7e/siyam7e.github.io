<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>United Investments Foundation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f7b62"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f5f3;--c:#fff;--t:#10261f;--p:#0f7b62;--d:#0b2b24;--m:#6b7c76;--l:#e6ece9;--g:#0f7b62;--r:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:10px;padding:10px 12px}
.top h2{flex:1;margin:0;font-size:17px}.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--l);background:#f4f7f6;font-size:18px}
.av{width:40px;height:40px;border-radius:50%}
#ov{display:block;opacity:0;pointer-events:none;transition:opacity .3s;position:fixed;inset:0;background:#0008;z-index:6;}#ov.on{opacity:1;pointer-events:auto}
#side{position:fixed;top:0;bottom:0;left:0;width:min(88vw,340px);background:var(--d);color:#cfe3dc;z-index:7;transform:translateX(-100%);transition:transform .34s cubic-bezier(.2,.8,.2,1),box-shadow .34s;overflow-y:auto;padding:16px 12px}
#side.on{transform:none;box-shadow:8px 0 30px #0005}.br{display:flex;gap:10px;align-items:center;margin-bottom:12px}.br img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.br div{min-width:0;flex:1}.br b{color:#fff;font-size:15px;letter-spacing:-.2px;white-space:nowrap;line-height:1.3;display:block}.br small{color:#8fb3a7}
.gh{font-size:11px;letter-spacing:1.5px;color:#6f9a8c;margin:16px 8px 6px;font-weight:700}
.it{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;color:#e4f1ec;font-size:15px;padding:11px 12px;border-radius:12px;text-align:left}
.it.on{background:#12493d;box-shadow:inset 3px 0 0 #2ed3a5}
main{padding:12px;max-width:760px;margin:auto}h1{font-size:22px;margin:6px 0 2px}.sub{color:var(--m);font-size:13px;margin-bottom:12px}
.act{display:flex;gap:8px;margin:10px 0 14px}.b{border-radius:12px;border:1px solid var(--l);background:#fff;padding:11px 14px;font-size:14px;color:var(--t)}.b.p{background:var(--p);color:#fff;border-color:var(--p)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 3px #0001;display:flex;gap:10px;align-items:center}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.k b{font-size:18px;display:block}.k span{font-size:12px;color:var(--m)}.k i{display:block;font-style:normal;font-size:11px;color:var(--m)}
.card{background:#fff;border-radius:16px;margin:12px 0;box-shadow:0 1px 3px #0001;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:14px;font-weight:700;font-size:15px;border-bottom:1px solid var(--l)}.ch em{color:var(--p);font-style:normal}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f3f6f5;color:var(--m);font-size:11px;letter-spacing:.6px;text-transform:uppercase;text-align:right;padding:10px 12px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--l);text-align:right;white-space:nowrap}tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left}tfoot td{background:#f3f6f5;font-weight:700}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:#fff;box-shadow:1px 0 0 var(--l)}.mx th:first-child{background:#f3f6f5}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.pg{background:#e1f5ec;color:#0f7b62}.pr{background:#fde8e5;color:#c0392b}.po{background:#fdf0dc;color:#b26a00}.pb{background:#e5eefb;color:#2456a6}
.nm{display:flex;align-items:center;gap:8px;color:var(--p);font-weight:600}.nm u{width:30px;height:30px;border-radius:50%;background:#e1f5ec;display:grid;place-items:center;font-size:12px;text-decoration:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--l);width:100%;background:none;border-left:0;border-right:0;border-top:0;font-size:15px;text-align:left}.row span{flex:1}
.nt{padding:12px 14px;border-bottom:1px solid var(--l)}.nt small{color:var(--m)}.nt p{margin:4px 0 0;color:var(--m)}
.ems{padding:22px;text-align:center;color:var(--m)}
#lock{position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#127a62,#082a23 70%);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.lc{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px #0006}
.lg{width:110px;height:110px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 16px #0004;margin-top:-70px;background:#fff}
.lc h1{font-size:19px;color:var(--d);margin:12px 0 2px}.lc p{margin:0 0 16px;color:var(--m);font-size:13px}#lt{font-size:14px;margin-bottom:8px}
.lc input{font-size:18px;text-align:center;width:100%;padding:13px;border-radius:12px;border:2px solid #cfdcd6;outline:0}.lc input:focus{border-color:var(--p)}
.lc .b{width:100%;margin-top:14px}#le{color:var(--r);font-size:13px;min-height:18px;margin-top:8px}
@media print{.top,#side,#ov,#lock,.no{display:none!important}body{background:#fff}}
.it.sb{padding-left:34px;font-size:14px}.sl{position:relative;margin:4px 0 12px;border-radius:16px;overflow:hidden;background:#dfe7e3;box-shadow:0 1px 3px #0001}
.stk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.stk::-webkit-scrollbar{display:none}
.stk img{flex:0 0 100%;width:100%;aspect-ratio:16/9;object-fit:cover;scroll-snap-align:start;display:block}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}.dots i{width:7px;height:7px;border-radius:4px;background:#ffffff99;transition:.2s}.dots i.on{background:#fff;width:18px}
.mi{border-bottom:1px solid var(--l)}.mi summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer}.mi summary::-webkit-details-marker{display:none}.mi summary span{color:var(--m);transition:.2s}.mi[open] summary span{transform:rotate(180deg)}
.kv td{white-space:normal;text-align:left!important}.kv td:first-child{color:var(--m);width:40%}
.pd{padding:14px}.pd p{margin:0 0 10px;color:var(--m);font-size:14px}.pd .b{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}.chip{border:1px solid var(--l);border-radius:20px;padding:7px 13px;font-size:14px;background:#fff;user-select:none}.chip input{display:none}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}


@keyframes up{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
@keyframes sheen{from{left:-70%}to{left:140%}}
@keyframes slin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 6px 18px #0004,0 0 0 4px rgba(46,211,165,.14),0 0 22px rgba(46,211,165,.25)}50%{box-shadow:0 6px 18px #0004,0 0 0 7px rgba(46,211,165,.22),0 0 44px rgba(46,211,165,.5)}}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(7%,5%) rotate(10deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translate3d(0,22px,0) scale(.96)}to{opacity:1;transform:none}}
.ani{animation:up .5s cubic-bezier(.16,1,.3,1) both}
.b,.b2,.k,.row,.it,.chip,.ib,.mi summary,.badge{transition:transform .45s cubic-bezier(.34,1.56,.64,1),border-color .3s}
.b:active,.b2:active,.k:active,.row:active,.it:active,.chip:active,.ib:active,.badge:active{transform:scale(.965);transition-duration:.12s}
.card{box-shadow:0 1px 3px #0001,0 8px 24px -14px #0f7b6233;background-image:linear-gradient(180deg,#ffffff,#fbfdfc)}
.k{position:relative;overflow:hidden;box-shadow:0 1px 3px #0001,0 8px 22px -14px #0f7b6240;background-image:linear-gradient(160deg,#ffffff 60%,#f6fbf9)}
.ic{box-shadow:inset 0 0 0 1px #ffffff,0 4px 12px -6px #0003}
.act2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}
.b2{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border:1px solid var(--l);border-radius:16px;background:#fff;color:var(--t);font-size:15px;font-weight:600;box-shadow:0 1px 3px #0001,0 8px 22px -14px #0f7b6240;overflow:hidden}
.b2 em{font-style:normal;background:#e5eefb;color:#2456a6;font-size:12px;border-radius:10px;padding:1px 7px}
.it.on{box-shadow:inset 3px 0 0 #2ed3a5}
#side.on .it{animation:slin .42s cubic-bezier(.2,.8,.2,1) both}
.top{background:rgba(255,255,255,.97);border-bottom:1px solid rgba(15,123,98,.08)}
.sl{box-shadow:0 10px 26px -14px #0f7b6266}
#lock{overflow:hidden}#lock::before{content:"";position:absolute;inset:-50%;background:radial-gradient(42% 42% at 25% 30%,rgba(46,211,165,.38),rgba(46,211,165,.12) 45%,transparent 75%),radial-gradient(38% 38% at 78% 22%,rgba(16,140,110,.5),rgba(16,140,110,.15) 45%,transparent 75%),radial-gradient(48% 48% at 62% 82%,rgba(232,163,23,.18),rgba(232,163,23,.06) 45%,transparent 75%);animation:aurora 16s ease-in-out infinite alternate;will-change:transform;pointer-events:none}
.lc{position:relative;z-index:1;animation:pop .7s cubic-bezier(.2,.8,.2,1) both}
.lgw{position:relative;width:110px;height:110px;margin:-70px auto 0;isolation:isolate}.lgw .lg{margin:0;display:block;box-shadow:0 6px 18px #0004,0 0 0 4px rgba(46,211,165,.16)}.lgw::before{content:"";position:absolute;inset:-18px;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(46,211,165,.55),rgba(46,211,165,.18) 45%,transparent 70%);animation:halo 3.2s ease-in-out infinite;will-change:transform,opacity}
@keyframes halo{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
#busy{flex-direction:column;gap:16px}.spin{width:46px;height:46px;border:3px solid #ffffff2a;border-top-color:#2ed3a5;border-radius:50%;animation:rot .9s linear infinite}
.sigw{display:flex;justify-content:center;margin:26px 0 20px}
.badge{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;padding:5px 16px;border-radius:999px;border:1px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#0f7b62,#2ed3a5,#e8a317) border-box;box-shadow:0 6px 18px -10px #0f7b6266}
.badge small{font-family:system-ui,sans-serif;font-size:11px;color:var(--m);letter-spacing:.4px;white-space:nowrap}
.badge span{font-family:"Great Vibes","Segoe Script","Brush Script MT",cursive;font-size:20px;line-height:1.5;padding:0 4px 0 1px;white-space:nowrap;background:linear-gradient(90deg,#0f7b62,#1aa37f,#e8a317);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge b{font-size:9px;color:#e8a317;font-weight:400}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dot{from{opacity:0;transform:scale(0)}60%{transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
@keyframes tipin{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.cb{transform-box:fill-box;transform-origin:50% 100%;animation:grow .75s cubic-bezier(.2,.8,.2,1) both;cursor:pointer;transition:opacity .2s}
.cb.sel{filter:drop-shadow(0 0 4px #2ed3a5aa)}svg:has(.cb.sel) .cb:not(.sel){opacity:.45}
.cl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s .35s cubic-bezier(.4,0,.2,1) forwards}
.cd{fill:#fff;stroke:#f2a33a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:dot .4s ease both}
.ctip{margin:10px 14px 0;font-size:13px;color:var(--m);text-align:center}.ctip.on{color:var(--t);animation:tipin .25s ease both}.ctip b{color:var(--p)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0) scale(1)}50%{transform:translate3d(6%,-4%,0) rotate(18deg) scale(1.12)}100%{transform:translate3d(-5%,5%,0) rotate(-14deg) scale(1.04)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.lc.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
.lc input{transition:border-color .3s,box-shadow .4s}.lc input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(15,123,98,.14),0 0 28px -6px rgba(46,211,165,.6)}
.gl{position:relative;isolation:isolate}
.gl::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:-1;transition:opacity .5s ease;will-change:opacity;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),rgba(46,211,165,.20),rgba(46,211,165,.06) 40%,transparent 70%)}
.gl.lit::before{opacity:1;transition:opacity .15s ease}
.gl.lit{border-color:rgba(46,211,165,.6)!important;box-shadow:0 0 0 1.5px rgba(46,211,165,.45),0 8px 20px -12px rgba(15,123,98,.5)!important}
.b.p.gl::before{background:radial-gradient(200px circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.30),transparent 65%)}
.b.p.gl.lit{box-shadow:0 0 0 2px rgba(46,211,165,.45),0 10px 22px -10px rgba(15,123,98,.7)!important}
.k.gl,.b2.gl,.row.gl,.card.gl{background-clip:padding-box}
.badge{text-decoration:none;cursor:pointer}
#busy{position:fixed;inset:0;background:#0b2b24;color:#fff;display:none;align-items:center;justify-content:center;z-index:30;font-size:17px}
#rp{position:fixed;left:0;top:0;width:760px;z-index:20;background:#fff;color:#10261f;font-family:system-ui,"Noto Sans Bengali",sans-serif;font-size:13px}
#rp .blk{padding:2px 0 6px;background:#fff}
#rp .rh{background:linear-gradient(135deg,#0b2b24,#0f7b62);color:#fff;border-radius:16px;padding:20px}
#rp .rh .rtop{display:flex;align-items:center;gap:14px}#rp .rh img{width:64px;height:64px}#rp .rh h2{margin:0;font-size:22px}#rp .rh small{opacity:.85;font-size:13px}
#rp .kg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}#rp .kg div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}#rp .kg span{display:block;font-size:12px;opacity:.9}#rp .kg b{font-size:18px}
#rp h3{margin:10px 0 8px;font-size:16px;color:#0f7b62;border-left:4px solid #0f7b62;padding-left:8px}
#rp table{width:100%;border-collapse:collapse;font-size:12.5px}#rp th{background:#e9f3ef;color:#0b2b24;padding:7px 8px;text-align:right;font-size:12px;text-transform:none;letter-spacing:0}#rp td{padding:7px 8px;border-bottom:1px solid #e3ebe7;text-align:right}#rp th:first-child,#rp td:first-child{text-align:left}#rp tfoot td{background:#f3f6f5;font-weight:700}
#rp table.sm{font-size:10.5px}#rp table.sm th,#rp table.sm td{padding:5px 3px;font-size:10.5px}
#rp .g{color:#0f7b62}#rp .r{color:#c0392b}#rp .pill{font-size:11.5px;padding:2px 7px}
#rp .rn{border-bottom:1px solid #e3ebe7;padding:8px 0}#rp .rn small{color:#6b7c76;display:block}#rp .rn p{margin:2px 0 0;color:#444}
#rp .mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}#rp .mib{border:1px solid #e3ebe7;border-radius:12px;padding:10px}#rp .mib>b{display:block;color:#0f7b62;margin-bottom:4px}#rp .kv td{padding:4px 6px;font-size:11.5px;white-space:normal;word-break:break-word}#rp .kv td:first-child{color:#6b7c76;width:38%}

async function makePDF(secs,name){const bz=document.getElementById("busy");bz.innerHTML=`<div class="spin"></div><div>${t("wait")}</div>`;bz.style.display="flex";
const box=document.createElement("div");box.id="rp";document.body.appendChild(box);
try{await libs();const{jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"}),W=595.28,H=841.89,M=26,FT=18,cw=W-2*M,avail=H-2*M-FT;let y=M,first=1;
for(const s of secs){const el=document.createElement("div");el.className="blk";el.innerHTML=s;box.appendChild(el);
await Promise.all([...el.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));

else{let sy=0;while(sy<c.height){if(!first||sy){if(y>M+40){pdf.addPage();y=M}}const room=(M+avail-y)*ppt,sh=Math.min(room,c.height-sy),p=document.createElement("canvas");p.width=c.width;p.height=sh;p.getContext("2d").drawImage(c,0,sy,c.width,sh,0,0,c.width,sh);pdf.addImage(p.toDataURL("image/jpeg",.9),"JPEG",M,y,cw,sh/ppt);y+=sh/ppt+10;sy+=sh;if(sy<c.height){pdf.addPage();y=M}}}
first=0;el.remove()}
const n=pdf.getNumberOfPages();for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text("United Investments Foundation",M,H-14);pdf.text(i+" / "+n,W-M,H-14,{align:"right"})}
const blob=pdf.output("blob"),file=new File([blob],name,{type:"application/pdf"});bz.style.display="none";
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name})}catch(e){if(e.name!="AbortError")throw e}}
else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}}
