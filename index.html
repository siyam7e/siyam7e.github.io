["ntf","🔔","g",{bn:["ফোনে নোটিফিকেশন চালু ও বন্ধ", ["ড্যাশবোর্ডে \"🔔 নোটিফিকেশন চালু করুন\" কার্ডে \"চালু করুন\" ক্লিক করুন, অথবা মেনু → \"🔔 নোটিফিকেশন\"।", "ফোন অনুমতি চাইলে \"Allow\" দিন। এরপর অ্যাপ বন্ধ থাকলেও নতুন নোটিশ, ভোট আর টাকা জমার খবর ফোনে আসবে।", "\"🧪 পরীক্ষা করুন\" ক্লিক করলে এই ফোনে একটা পরীক্ষামূলক নোটিফিকেশন আসবে।", "\"কোন খবর পাবেন\" অংশে যেটা চান না সেটা বন্ধ করুন। নিজের টাকা জমার খবর সবসময় চালু থাকে।", "ভুল করে \"Block\" দিয়ে থাকলে ফোনের Settings → Apps → UIF → Notifications → Allow দিন।", "নোটিফিকেশনে ক্লিক করলে অ্যাপের ঠিক সেই পাতা খুলবে।"]],en:["Turn phone notifications on & off", ["Click \"Turn on\" on the dashboard card, or Menu → \"🔔 Notifications\".", "When the phone asks, click \"Allow\". Notices, votes and payment updates will then arrive even when the app is closed.", "Click \"🧪 Test\" to get a test notification on this phone.", "Under \"What you'll get\" turn off anything you don't want. Your own payment updates are always on.", "If you clicked \"Block\" by mistake: phone Settings → Apps → UIF → Notifications → Allow.", "Clicking a notification opens the right page of the app."]]},[["menu", "#side [data-t=ntf]", "মেনু থেকে \"🔔 নোটিফিকেশন\" খুলুন।", "Open \"🔔 Notifications\" from the menu."], ["ntf", ".nps", "এখানে দেখবেন এই ফোনে নোটিফিকেশন চালু কিনা। বন্ধ থাকলে নিচের বাটনে চালু করুন।", "See whether notifications are on for this phone, and turn them on below."], ["ntf", "#npt", "কোন কোন খবর পাবেন এখানে বেছে নিন।", "Choose which updates you get."]],"mntf"],
["vote","🗳️","g",{bn:["কীভাবে ভোট দেবেন",["নতুন ভোট এলে ড্যাশবোর্ডে পপআপ ও সোনালি সারি আসে।","পপআপ থেকে সরাসরি, বা মেনু → \"🗳️ ভোট\" থেকে অপশন ক্লিক করুন।","নিশ্চিত করুন — একবার ভোট দিলে আর বদলানো যায় না।","ভোট দেওয়ার পর ফলাফল দেখতে পাবেন।"]],en:["How to vote",["A popup and a gold bar appear on the dashboard for new votes.","Click an option there or in Menu → \"🗳️ Votes\".","Confirm — a vote cannot be changed later.","Results appear after you vote."]]},[["menu","#side [data-t=vote]","মেনু থেকে \"🗳️ ভোট\" খুলে অপশন ক্লিক করুন। পাশের লাল সংখ্যা = বাকি ভোট।","Open \"🗳️ Votes\" and click an option. The red number = votes pending."]],"mvote"],
["read","📣","g",{bn:["নোটিশ ও নিয়মকানুন পড়া",["বেলে 🔔 সংখ্যা মানে নতুন কিছু আছে।","বেলে ক্লিক করলে যেখানে নতুন আছে সেখানে নিয়ে যাবে।","পড়া শেষে \"✓ পড়েছি\" ক্লিক করুন, সংখ্যা কমে যাবে।"]],en:["Reading notices & rules",["A number on the 🔔 bell means something new.","Click the bell to go there.","Click \"✓ Read\" after reading."]]},[["home","#bell","বেলের লাল সংখ্যা মানে নতুন নোটিশ বা নিয়ম আছে — ক্লিক করলে সেখানে নিয়ে যাবে।","A red number means something new — click to go there."]],"mread"],
["pdf","📄","g",{bn:["PDF রিপোর্ট বানানো ও শেয়ার",["মেনু → \"📄 PDF রিপোর্ট\"।","এক বা একাধিক মাস বাছাই করুন।","\"PDF তৈরি ও শেয়ার\" ক্লিক করুন — আগে প্রিভিউ দেখাবে।","\"⬇️ ফোনে সেভ করুন\" ক্লিক করলে সরাসরি ফোনের Downloads-এ যাবে, আর \"📤 শেয়ার\" দিয়ে WhatsApp-এ পাঠাতে পারবেন। ইন্টারনেট লাগবে।"]],en:["Create & share a PDF report",["Menu → \"📄 PDF report\".","Pick one or more months.","Click \"Create & share PDF\" — a preview opens.","\"⬇️ Save to phone\" saves it straight to Downloads; \"📤 Share\" sends it on WhatsApp. Needs internet."]]},[["menu","#side [data-t=rep]","মেনু থেকে \"📄 PDF রিপোর্ট\" খুলে মাস বাছাই করুন।","Open \"📄 PDF report\" and pick months."]],"mpdf"],
["stmt","📄","g",{bn:["বছরের বিবরণী (PDF) নামানো", ["মেনু → \"👤 আমার হিসাব\" → নিচে \"📄 বছরের বিবরণী (PDF)\"।", "আগের বছরের হিসাব থাকলে বছর বাছাই করুন।", "\"📄 বিবরণী তৈরি করুন\" ক্লিক করুন — আগে প্রিভিউ দেখাবে।", "\"⬇️ ফোনে সেভ করুন\" দিয়ে সরাসরি Downloads-এ রাখুন, বা \"📤 শেয়ার\" দিয়ে WhatsApp-এ পাঠান।", "এতে থাকে: মাসভিত্তিক জমা (কবে ও কীভাবে), জরিমানা, বছরের মোট আর ফাউন্ডেশনে আপনার অংশ। অ্যাপ থেকে তৈরি, তাই স্বাক্ষর লাগে না।", "এডমিন ও ক্যাশিয়ার: \"📄 PDF রিপোর্ট\" পাতার ৪ নম্বর অংশ থেকে যেকোনো সদস্যের বিবরণী বানাতে পারবেন।"]],en:["Download your annual statement (PDF)", ["Menu → \"👤 My account\" → \"📄 Annual statement (PDF)\" at the bottom.", "Pick the year if older years exist.", "Click \"📄 Create statement\" — a preview opens.", "\"⬇️ Save to phone\" saves it to Downloads; \"📤 Share\" sends it on WhatsApp.", "It shows month-by-month payments (when & how), fines, yearly totals and your foundation share. Made by the app, so no signature is needed.", "Admin & cashier: section 4 of \"📄 PDF report\" makes a statement for any member."]]},[["menu", "#side [data-t=me]", "মেনু থেকে \"👤 আমার হিসাব\" খুলুন।", "Open \"👤 My account\"."], ["me", "#ysc", "নিচের এই কার্ড থেকে বছরের বিবরণী বানান।", "Create your annual statement from this card."]],null],
["kick","🔄","g",{bn:["হঠাৎ লগআউট বা \"অন্য ডিভাইস থেকে লগইন\"",["একটি অ্যাকাউন্ট একসাথে একটি ফোনেই চলে।","অন্য ফোনে লগইন করলে আগের ফোন লগআউট হয়ে যায় — আবার লগইন করুন।","আপনি অন্য কোথাও লগইন না করে থাকলে সাথে সাথে পাসওয়ার্ড বদলান ও অ্যাডমিনকে জানান।"]],en:["Logged out / \"logged in on another device\"",["One account works on one phone at a time.","Logging in elsewhere logs out the old phone — just log in again.","If it was not you, change your password and tell the admin."]]},null,null],
["slow","📶","g",{bn:["অ্যাপ ধীর, তথ্য আসছে না, বা আপডেট দেখছেন না",["ইন্টারনেট সংযোগ দেখুন।","অ্যাপ পুরোপুরি বন্ধ করে আবার খুলুন।","নতুন আপডেট এলে কখনো দুইবার বন্ধ-খোলা লাগতে পারে।","\"সংযোগ হয়নি\" দেখালে \"🔄 আবার চেষ্টা করুন\" ক্লিক করুন।"]],en:["App slow, no data or no update",["Check your internet.","Close the app fully and open it again.","After an update you may need to do this twice.","If it says no connection, click \"🔄 Try again\"."]]},null,null],
["lang","🌐","g",{bn:["ভাষা বদলানো",["মেনু খুলুন।","নিচে \"🌐 ভাষা\" সারিতে বাংলা বা English ক্লিক করুন।"]],en:["Change language",["Open the menu.","In the \"🌐 Language\" row click বাংলা or English."]]},[["menu","#side .lng","এখানে বাংলা বা English ক্লিক করুন।","Click বাংলা or English here."]],"mlang"],
["c_ver","🗂️","c",{bn:["রিকোয়েস্ট যাচাই করা", ["মেনু → \"🗂️ ক্যাশিয়ার প্যানেল\" → নতুন রিকোয়েস্ট।", "প্রতিটি রিকোয়েস্টে রঙিন চিহ্নে দেখা যায় সদস্য কীভাবে দিয়েছেন: বিকাশ, নগদ, না ক্যাশ।", "বিকাশ/নগদ হলে নিজের হিস্ট্রির সাথে শেষ ৪ সংখ্যা, টাকা আর তারিখ মেলান। ক্যাশ হলে হাতে পাওয়া টাকার সাথে মেলান।", "মিললে \"✅ জমা হয়েছে\", না মিললে \"❌ হয়নি\" ক্লিক করুন।", "⚠️ = টাকা মিলছে না, ⏰ = ২৪ ঘণ্টার বেশি পেন্ডিং।"]],en:["Verifying requests", ["Menu → \"🗂️ Cashier panel\" → New requests.", "A coloured chip shows how the member paid: bKash, Nagad or Cash.", "For bKash/Nagad match the last 4 digits, amount and date with your history. For cash, match the money you received.", "Click \"✅ Got it\" if it matches, otherwise \"❌ Not got\".", "⚠️ = amount mismatch, ⏰ = pending over 24 h."]]},[["cash", ".py", "প্রতিটি রিকোয়েস্টে মাধ্যম, শেষ ৪ সংখ্যা, টাকা আর তারিখ মিলিয়ে জমা/হয়নি ক্লিক করুন।", "Check the method, last 4 digits, amount and date, then mark it."]],"mcas"],
["c_cash","💵","c",{bn:["ক্যাশ জমা এন্ট্রি",["হাতে হাতে টাকা নিলে \"💵 ক্যাশ জমা এন্ট্রি\" কার্ড খুলুন।","সদস্য, মাস আর টাকা দিন।","\"✓ জমা করুন\" — সাথে সাথে হিসাবে উঠে যাবে।"]],en:["Cash entry",["For cash received by hand open \"💵 Cash entry\".","Choose member, month and amount.","Click \"✓ Add payment\" — it is counted immediately."]]},[["cash","#k_who","সদস্য বাছাই করে মাস ও টাকা দিন, তারপর জমা করুন।","Choose the member, month and amount, then add."]],null],
["c_num","📲","c",{bn:["টাকা পাঠানোর নাম্বার বদলানো", ["ক্যাশিয়ার প্যানেলের নিচে (অ্যাডমিন: ⚙️ সেটিং) \"📲 টাকা পাঠানোর নাম্বার\" কার্ড খুলুন।", "নাম্বারটি কিসের — বিকাশ, নগদ, না দুটোই — বাছাই করুন।", "বিকাশ/নগদ নাম্বার লিখুন (০১ দিয়ে ১১ সংখ্যা)।", "WhatsApp আলাদা নাম্বারে হলে সেটা দিন; বিদেশি নাম্বার হলে + দিয়ে দেশের কোডসহ, যেমন +966 55 123 4567। খালি রাখলে উপরের নাম্বারেই WhatsApp যাবে।", "\"✓ সেভ\" ক্লিক করুন — সদস্যরা সাথে সাথে নতুন নাম্বার দেখবেন।"]],en:["Change the payment number", ["Open the \"📲 Payment number\" card at the bottom of the cashier panel (admin: ⚙️ Settings).", "Choose the type — bKash, Nagad or both.", "Enter the bKash/Nagad number (11 digits starting with 01).", "If WhatsApp is on another number, enter it; for a foreign number use + and the country code, e.g. +966 55 123 4567. Leave empty to use the number above.", "Click \"✓ Save\" — members see the new number right away."]]},[["cash", "#pic", "এখানে নাম্বারের ধরন, নাম্বার আর WhatsApp দিয়ে সেভ করুন।", "Set the type, number and WhatsApp here, then save."]],null],
["c_rem","💬","c",{bn:["WhatsApp রিমাইন্ডার পাঠানো", ["ক্যাশিয়ার প্যানেল (অ্যাডমিন: 💵 হিসাব) → \"📲 WhatsApp রিমাইন্ডার\"।", "এ মাসে যাঁদের চাঁদা বা জরিমানা বাকি, তাঁদের তালিকা দেখাবে — কত বাকি, আংশিক কি না।", "নামের পাশে 💬 ক্লিক করলে বার্তা লেখা অবস্থায় WhatsApp খুলবে, শুধু পাঠান ক্লিক করুন।", "পাঠানোর পর নামের নিচে \"✓ আজ পাঠানো হয়েছে\" দেখাবে, যাতে একজনকে দুবার না পাঠান।", "⚠️ \"দেশের কোড দিন\" দেখালে ওই সদস্যের মোবাইল নাম্বারে কোড নেই — অ্যাডমিন বা মডারেটর ঠিক করে দেবেন।"]],en:["Sending WhatsApp reminders", ["Cashier panel (admin: 💵 Accounts) → \"📲 WhatsApp reminders\".", "It lists members with contribution or fines due this month — how much, and whether partly paid.", "Click 💬 next to a name: WhatsApp opens with the message ready, just click send.", "Afterwards \"✓ Sent today\" appears under the name so you don't send twice.", "⚠️ \"Add country code\" means that member's number has no code — the admin or a moderator can fix it."]]},[["cash", "#rmc", "এখানে বাকি থাকা সদস্যদের তালিকা। 💬 ক্লিক করলে WhatsApp-এ বার্তা তৈরি থাকবে।", "Members with dues. Click 💬 and the WhatsApp message is ready."]],"mrem"],
["m_not","🛠️","m",{bn:["নোটিশ, ভোট ও সদস্যের তথ্য", ["মেনু → \"🛠️ মডারেটর প্যানেল\"।", "\"📣 নোটিশ ও ভোট\" ট্যাবে নোটিশ বা ভোট যোগ করুন।", "\"🪪 সদস্যের তথ্য\" ট্যাবে সদস্য বাছাই করে তথ্য হালনাগাদ করুন।"]],en:["Notices, votes & member details", ["Menu → \"🛠️ Moderator panel\".", "Add notices or votes in \"📣 Notices & votes\".", "Update details in \"🪪 Member details\"."]]},null,null],
["m_ved","✏️","m",{bn:["ভোট সম্পাদনা", ["প্যানেল → \"📣 নোটিশ ও ভোট\" → যে ভোট বদলাবেন তার পাশে ✏️ ক্লিক করুন।", "প্রশ্ন, বিস্তারিত, অপশন, পাসের নিয়ম আর শেষ তারিখ — সবকিছু যেকোনো সময় বদলানো যায়, ভোট চলাকালীনও।", "অপশনের নাম বা ক্রম বদলালে আগের ভোট সঠিক অপশনেই থাকে।", "কোনো অপশন মুছে দিলে সেটির ভোট বাতিল হয়, তাঁরা আবার ভোট দিতে পারবেন। সেভের আগে অ্যাপ জানিয়ে দেবে।", "সম্পাদিত ভোটে সবার কাছে \"✏️ সম্পাদিত\" চিহ্ন দেখায়।"]],en:["Editing a vote", ["Panel → \"📣 Notices & votes\" → click ✏️ next to the vote.", "Question, details, options, pass rule and end date can all be changed any time, even while voting is open.", "Renaming or reordering options keeps existing votes on the right option.", "Removing an option cancels its votes so those members can vote again. The app warns you before saving.", "Edited votes show an \"✏️ Edited\" mark to everyone."]]},[["admin:not", "#ed_v", "ভোটের পাশে ✏️ ক্লিক করলে এই ফর্মে সব আগের মতো ভরা থাকবে — বদলে সেভ করুন।", "Click ✏️ on a vote and this form is filled in — change and save."]],null],
["a_phone","📞","m",{bn:["বিদেশি মোবাইল নাম্বার লেখা", ["প্যানেল → \"🪪 সদস্যের তথ্য\" (অ্যাডমিন: 👥 সদস্য → সদস্যের তথ্য) → সদস্য বাছাই করুন।", "বাংলাদেশি নাম্বার হলে 01… লিখলেই চলবে।", "বিদেশে থাকা সদস্যের নাম্বার + দিয়ে দেশের কোডসহ লিখুন, যেমন: +966 55 123 4567।", "কোড না থাকলে WhatsApp রিমাইন্ডার পাঠানো যাবে না, তালিকায় ⚠️ দেখাবে।"]],en:["Writing foreign mobile numbers", ["Panel → \"🪪 Member details\" (admin: 👥 Members → Member details) → choose the member.", "A Bangladeshi number can be written as 01….", "For members abroad write + and the country code, e.g. +966 55 123 4567.", "Without a code WhatsApp reminders can't be sent and ⚠️ is shown."]]},[["admin:mem", "#im_8", "মোবাইল নাম্বার এখানে। বিদেশি হলে + দিয়ে দেশের কোডসহ লিখুন।", "The mobile number goes here. For foreign numbers add + and the country code."]],null],
["a_mem","👥","a",{bn:["নতুন সদস্য ও লগইন",["অ্যাডমিন প্যানেল → 👥 সদস্য → নাম ও শেয়ার দিয়ে যোগ করুন।","\"🔐 ব্যবহারকারী ও পাসওয়ার্ড\"-এ সদস্য, ইউজারনেম ও পাসওয়ার্ড দিন।","সদস্যকে ইউজারনেম ও পাসওয়ার্ড জানান।"]],en:["New member & login",["Admin panel → 👥 Members → add name and shares.","In \"🔐 Users & passwords\" set username and password.","Tell the member their login."]]},null,null],
["a_rst","🔑","a",{bn:["কারো পাসওয়ার্ড রিসেট / দেখা",["অ্যাডমিন প্যানেল → 👥 সদস্য → ব্যবহারকারীর পাশে ⚙️।","\"🔑 পাসওয়ার্ড\" → নতুন পাসওয়ার্ড → সেভ।","আপনার দেওয়া পাসওয়ার্ড 👁️ ক্লিক করে দেখা যায়, যতক্ষণ সদস্য নিজে না বদলান।"]],en:["Reset / view a password",["Admin panel → 👥 Members → ⚙️ next to the user.","\"🔑 Password\" → new password → save.","Passwords you set can be seen with 👁️ until the member changes them."]]},null,null],
["a_fine","🤖","a",{bn:["স্বয়ংক্রিয় জরিমানা",["৬ তারিখের পর অ্যাডমিন প্যানেল → 💵 হিসাব → 🤖।","মাস দেখে নিন, বাদ রাখতে চাইলে টিক তুলুন।","\"⚖️ জরিমানা বসান\" ক্লিক করুন।"]],en:["Automatic fines",["After the 5th: Admin panel → 💵 Accounts → 🤖.","Check the month, untick anyone to skip.","Click \"⚖️ Add fines\"."]]},null,null],
["a_rtpl","📝","a",{bn:["রিমাইন্ডারের বার্তা বদলানো", ["অ্যাডমিন প্যানেল → 💵 হিসাব → \"📲 WhatsApp রিমাইন্ডার\" → \"✏️ বার্তা বদলান\"।", "বার্তা নিজের মতো লিখুন। {নাম}, {মাস}, {টাকা}, {বিস্তারিত} এর মতো ঘর রাখলে অ্যাপ প্রত্যেকের তথ্য নিজে বসাবে।", "নিচে একজন সদস্যের নমুনা বার্তা দেখাবে — যেমন যাবে ঠিক তেমন।", "\"✓ সেভ\" ক্লিক করুন। আগের লেখায় ফিরতে \"↺ আগের লেখায় ফিরুন\"।"]],en:["Editing the reminder message", ["Admin panel → 💵 Accounts → \"📲 WhatsApp reminders\" → \"✏️ Edit message\".", "Write it your way. Fields like {নাম}, {মাস}, {টাকা}, {বিস্তারিত} are filled in for each member.", "A preview below shows exactly what a member will get.", "Click \"✓ Save\". Use \"↺ Restore default\" to go back."]]},[["admin:acc", "#rmc .rte", "এখানে ক্লিক করে বার্তা বদলান। নিচে নমুনা দেখে নিন।", "Click here to edit the message and check the preview."]],"mrem"],
["a_led","📒","a",{bn:["আয়-ব্যয় ও ব্যাংকে টাকা রাখা",["অ্যাডমিন প্যানেল → 💵 হিসাব → 📒 আয়-ব্যয় এন্ট্রি।","আয়, ব্যয় বা স্থানান্তর বাছাই করে টাকা ও জায়গা দিন।","হাত থেকে ব্যাংকে রাখলে \"🔁 স্থানান্তর\" ব্যবহার করুন।"]],en:["Ledger & bank deposits",["Admin panel → 💵 Accounts → 📒 Ledger entry.","Choose income, expense or transfer and the place.","Use \"🔁 Transfer\" to move cash to the bank."]]},null,null],
["a_ref","↩️","a",{bn:["নিষ্ক্রিয় সদস্যের টাকা ফেরত দিলে",["টাকা ফেরত দেওয়ার দিনই অ্যাডমিন প্যানেল → 💵 হিসাব → 📒 আয়-ব্যয় এন্ট্রি খুলুন।","ধরন \"ব্যয়\" বাছাই করুন, টাকার পরিমাণ আর কোথা থেকে দিলেন (হাত/ব্যাংক) দিন।","বিবরণে লিখুন, যেমন: \"জিসান খাঁনের জমানো টাকা ফেরত\"।","সেভ করলে মোট ফান্ড আর ক্যাশ নিজে থেকে কমে যাবে, রেকর্ডও থেকে যাবে।","এরপর ⚙️ সেটিং বা Sheet-এর Summary থেকে \"জিসানের সঞ্চয়\" বদলাবেন না — দুবার বাদ পড়বে।"]],en:["Refunding an inactive member",["On the refund day open Admin panel → 💵 Accounts → 📒 Ledger entry.","Choose \"Expense\", enter the amount and where it was paid from (hand/bank).","Write a note, e.g. \"Refund of Jisan Khan's savings\".","Saving lowers the total fund and cash automatically and keeps a record.","Do not also change \"Jisan's savings\" in Settings or the Sheet — it would be subtracted twice."]]},null,null],
["a_role","🗂️","a",{bn:["ক্যাশিয়ার ও মডারেটর বদলানো",["অ্যাডমিন প্যানেল → 👥 সদস্য → ব্যবহারকারীর পাশে ⚙️।","\"💼 ক্যাশিয়ার বানান\" বা \"🛠️ মডারেটর বানান\"।","ক্যাশিয়ার একজন, মডারেটর একাধিক রাখা যায়।"]],en:["Change cashier & moderators",["Admin panel → 👥 Members → ⚙️ next to the user.","\"💼 Make cashier\" or \"🛠️ Make moderator\".","One cashier; several moderators allowed."]]},null,null],

["a_bk","💾","a",{bn:["ব্যাকআপ ও তথ্য ফেরত আনা", ["অ্যাডমিন প্যানেল → ⚙️ সেটিং → \"💾 সাপ্তাহিক ব্যাকআপ\"।", "প্রতি শুক্রবার পুরো Google Sheet-এর একটি কপি আপনার Google Drive-এর \"UIF Backup\" ফোল্ডারে নিজে থেকে জমা হয়; সবশেষ ৮টি কপি রাখা হয়।", "বড় কোনো পরিবর্তনের আগে \"💾 এখনই ব্যাকআপ নিন\" ক্লিক করে রাখতে পারেন।", "কিছু মুছে গেলে \"📁 ফোল্ডার খুলুন\" → যে তারিখের কপি দরকার সেটা খুলুন।", "কপি থেকে দরকারি ঘরগুলো কপি করে মূল UIF Sheet-এ একই জায়গায় পেস্ট করুন। মূল Sheet মুছবেন না বা বদলাবেন না — অ্যাপ মূল Sheet-এর সাথেই যুক্ত।"]],en:["Backup & restoring data", ["Admin panel → ⚙️ Settings → \"💾 Weekly backup\".", "Every Friday a copy of the whole Google Sheet is saved to the \"UIF Backup\" folder in your Google Drive; the latest 8 are kept.", "Before a big change you can click \"💾 Back up now\".", "If something gets deleted, click \"📁 Open folder\" and open the copy from the right date.", "Copy the cells you need and paste them into the same place in the main UIF Sheet. Don't delete or replace the main Sheet — the app is linked to it."]]},[["admin:set", "#bkc", "এখানে শেষ ব্যাকআপ কবে হয়েছে দেখবেন, চাইলে এখনই ব্যাকআপ নিতে পারবেন।", "See when the last backup ran, or back up now."]],null],
