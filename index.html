["status","⏳","g",{"bn":["রিকোয়েস্টের অবস্থা, বাতিল ও রসিদ",["\"💸 টাকা জমা দিন\" পাতার \"📋 রিকোয়েস্ট দেখুন\" ট্যাবে সব রিকোয়েস্ট দেখা যায়। তথ্য পাঠানোর পর অ্যাপ নিজেই এই ট্যাবে নিয়ে আসে।","\"আমার\" ক্লিক করলে শুধু নিজেরগুলো দেখাবে।","প্রতিটি কার্ডের বাঁয়ের রঙিন দাগ আর ডানের লেখা অবস্থা বোঝায়: হলুদ = ⏳ পেন্ডিং, সবুজ = ✅ জমা হয়েছে, লাল = ❌ হয়নি।","পেন্ডিং অবস্থায় ভুল হলে \"✕ বাতিল করুন\" ক্লিক করুন।","✅ জমা হলে \"🧾 রসিদ\" থেকে ছবি বা PDF নামাতে পারবেন।"]],"en":["Request status, cancel & receipt",["The \"📋 View requests\" tab of \"💸 Pay contribution\" shows all requests. After you report, the app takes you there.","Click \"Mine\" to see only yours.","The coloured stripe and label show the status: yellow = ⏳ Pending, green = ✅ Received, red = ❌ Not received.","If a pending request is wrong, click \"✕ Cancel\".","When received, download an image or PDF from \"🧾 Receipt\"."]]},[["pay:r",".sgf:not(.ptb) button:nth-child(2)","\"আমার\" ক্লিক করলে শুধু আপনার রিকোয়েস্টগুলো দেখাবে।","Click \"Mine\" to see only your requests."],["pay:r",".py","প্রতিটি কার্ডে অবস্থা লেখা থাকে। পেন্ডিং হলে বাতিল, জমা হলে রসিদ বাটন পাবেন।","Each card shows its status. Cancel while pending; receipt once received."]],"mst"],
["fine","⚖️","g",{"bn":["জরিমানা কত ও কীভাবে পরিশোধ করবেন",["শেষ সময়: নিজের দেশের ৫ তারিখ রাত ১২টা (ফোনের সময় অনুযায়ী)। এর মধ্যে পুরো চাঁদা পাঠিয়ে তথ্য না দিলে জরিমানা নিজে থেকেই বসে।","শেষ সময়ের আগে টাকার তথ্য দিলে সময়মতো ধরা হয় — ক্যাশিয়ার পরে যাচাই করলেও। যাচাইয়ে \"হয়নি\" হলে তখন জরিমানা বসে।","পরিমাণ: ২০২৬ সালে নাম প্রতি ২০০ ৳; ২০২৭ থেকে বাকি টাকার ১০%। জরিমানা বসার পরে চাঁদা দিলেও জরিমানা বদলায় না।","আপনার জরিমানা দেখবেন মেনু → \"⚖️ জরিমানা\" আর \"👤 আমার হিসাব\"-এ; ড্যাশবোর্ডেও লাল বার্তা আসে।","পরিশোধ: পুরো টাকা ক্যাশিয়ারের নাম্বারে পাঠান (\"💸 টাকা জমা\" → \"📲 পেমেন্ট করুন\"), তারপর \"📝 তথ্য দিন\" ট্যাবে \"কোন মাসের চাঁদা\" ঘরে \"জরিমানা – মাস\" বাছাই করুন।","পুরো টাকা লিখুন — কম হলে জরিমানা জমা হবে না। ভুল করে জরিমানা হলে অ্যাডমিন কারণসহ বাতিল করতে পারেন, আপনি নোটিফিকেশনে জানবেন।"]],"en":["How much a fine is & how to pay it",["Deadline: midnight on the 5th in your own country (by your phone's clock). If the full contribution is not sent and reported by then, a fine is added automatically.","Money reported before the deadline counts as on time, even if the cashier verifies it later. If it is marked \"not received\", the fine is added then.","Amount: in 2026, ৳ 200 per share; from 2027, 10% of the unpaid amount. Paying later does not change a fine already added.","See your fines in Menu → \"⚖️ Fines\" and \"👤 My account\"; the dashboard also shows a red message.","To pay: send the full amount to the cashier's number (\"💸 Pay\" → \"📲 Make payment\"), then in the \"📝 Report\" tab choose \"Fine – month\" in the month field.","Enter the full amount — less is not accepted. If a fine was a mistake the admin can void it with a reason and you'll get a notification."]]},[["pay:f","#p_m","এখানে \"জরিমানা – মাস\" বাছাই করে পুরো টাকা লিখে পাঠান।","Choose \"Fine – month\" here and send the full amount."]],"mfine"],
["spm","⭐","g",{"bn":["মাসিক চাঁদা, বিশেষ চাঁদা ও স্মরণ-বার্তা",["আপনার প্রতি মাসের চাঁদা একটাই সংখ্যা = নিয়মিত (নাম প্রতি ১,০০০ ৳) + সেই মাসের বিশেষ চাঁদা (যে মাসে থাকে)। ছকে মোটটা দেখায়, নিচে ছোট করে ভাগ।","ডিসেম্বর ২০২৬: প্রতি নামে ৫,০০০ ৳ (নিয়মিত ১,০০০ + বিশেষ ৪,০০০; ২ নামে ১০,০০০ ৳), ৫ ডিসেম্বরের মধ্যে।","২০২৭ সালে প্রতি মাসে প্রতি নামে ৪,০০০ ৳ (নিয়মিত ১,০০০ + বিশেষ ৩,০০০; ২ নামে ৮,০০০ ৳)। হার অ্যাডমিন বদলাতে পারেন।","টাকা দেওয়ার সময় শুধু \"কোন মাসের চাঁদা\" ঘরে মাস বাছাই করুন — অ্যাপ নিজেই আগে নিয়মিত, বাকিটা বিশেষে ভাগ করে।","এক মাসে নির্ধারিতের বেশি দেওয়া যাবে না। বাড়তি দিতে চাইলে \"➕ অতিরিক্ত চাঁদা\" বাছাই করুন — এটা কোনো মাসের সঙ্গে যুক্ত থাকে না, \"👤 আমার হিসাব\"-এ আলাদা দেখায়।","৫ তারিখের মধ্যে পুরো না দিলে জরিমানা হয় (২০২৬: নাম প্রতি ২০০ ৳; ২০২৭: বাকি টাকার ১০%, যেমন ২,৫০০ বাকি → ২৫০ ৳)। শেষ সময় নিজের দেশের ৫ তারিখ রাত ১২টা; এর আগে তথ্য দিলে সময়মতো ধরা হয়।","১ থেকে ৫ তারিখ ড্যাশবোর্ডে প্রতিদিন স্মরণ-বার্তা দেখাবে (দিন যত যায় রং নীল → হলুদ → কমলা → লাল); ৫ তারিখে কত ঘণ্টা বাকি গুনে দেখায়, আপনার ফোনের সময়ে শেষ সময়ও লেখা থাকে।","ফোনে নোটিফিকেশন যায় ১, ৩, ৪ ও ৫ তারিখ সকালে, আর ৫ তারিখ বিকেলে আরেকবার — পুরো জমা দিলে আর যায় না।"]],"en":["Monthly contribution, special contribution & reminders",["Your contribution for a month is one number = regular (৳ 1,000 per share) + that month's special contribution (when there is one). The grid shows the total with a small split below.","December 2026: ৳ 5,000 per share (1,000 regular + 4,000 special; ৳ 10,000 for 2 shares), by 5 December.","In 2027: ৳ 4,000 per share each month (1,000 regular + 3,000 special; ৳ 8,000 for 2 shares). The admin can change the rate.","When paying just choose the month — the app splits it (regular first, the rest special).","You cannot pay more than the month's due. For extra, choose \"➕ Extra contribution\" — it isn't tied to a month and shows separately in \"👤 My account\".","If not paid in full by the 5th a fine is added (2026: ৳ 200 per share; 2027: 10% of the unpaid amount, e.g. 2,500 unpaid → ৳ 250). The deadline is midnight on the 5th in your own country; money reported before it counts as on time.","From the 1st to the 5th the dashboard shows a daily reminder (blue → yellow → orange → red); on the 5th it counts down the hours and shows the deadline in your phone's time.","Phone notifications go on the mornings of the 1st, 3rd, 4th and 5th, and once more on the afternoon of the 5th — not once you've paid in full."]]},null,null],
["goal","🎯","g",{"bn":["বছরের লক্ষ্য ও অগ্রগতি বার",["হোম পাতায় টাকার টাইলগুলোর নিচে \"🎯 লক্ষ্য\" কার্ড — এ বছর ফাউন্ডেশন কতদূর এগোল।","লক্ষ্য = বছরের শুরুর ফান্ড (পূর্ববর্তী বছরের তহবিল + জিসানের সঞ্চয়) + এ বছরের সব নির্ধারিত চাঁদা (নিয়মিত + বিশেষ)।","অগ্রগতি = এখনকার মোট ফান্ড (চাঁদা, জরিমানা, লাভ সব মিলিয়ে; খরচ বাদে)। শতাংশ, জমা আর লক্ষ্যের টাকা কার্ডে লেখা থাকে।","বারের ৫০%, ৭৫%, ৯০% দাগ পার হলে ✓ হয়। নিচের লাইনে পরের ধাপে পৌঁছাতে আর কত টাকা লাগবে দেখায়।","কোনো ধাপ (৫০/৭৫/৯০/১০০%) পার হলে সবার ফোনে নোটিফিকেশন যায় আর অ্যাপ খুললে একবার উদযাপনের পপআপ আসে। কার্ডে ক্লিক করলে আবার দেখা যায়।","১০০% পার হলে বার পুরো সোনালি হয় আর লক্ষ্যের চেয়ে কত বেশি জমা হলো তা দেখায়।"]],"en":["Yearly goal and progress bar",["On the home page, below the money tiles, the \"🎯 goal\" card shows how far the foundation has come this year.","Goal = fund at the start of the year (previous years' fund + Jisan's savings) + all scheduled dues this year (regular + special).","Progress = the current total fund (dues, fines, profit; minus expenses). The card shows the percentage, saved amount and goal.","The 50%, 75% and 90% marks get a ✓ once passed. The bottom line shows how much more is needed for the next step.","When a step (50/75/90/100%) is passed, everyone gets a phone notification and a one-time celebration pop-up in the app. Click the card to see it again.","Beyond 100% the bar turns fully golden and shows how much more than the goal has been saved."]]}],
["mine","👤","g",{"bn":["নিজের হিসাব ও অংশ দেখা",["মেনু → \"👤 আমার হিসাব\"।","ওপরে \"📷 আমার ছবি\", তারপর মোট জমা, নির্ধারিত আর অগ্রিম/বাকি।","১২ মাসের রঙিন বার: উচ্চতা = সেই মাসে মোট জমা (নিয়মিত + বিশেষ); সবুজ = পূর্ণ, হলুদ = আংশিক, লাল = বাকি।","নিচে \"➕ আমার অতিরিক্ত চাঁদা\", শেয়ার হস্তান্তর হয়ে থাকলে \"🔁 শেয়ার হস্তান্তর\", \"🏛️ ফাউন্ডেশনে আমার অংশ\" আর \"⚖️ আমার জরিমানা\" — বাকি ও পরিশোধিত আলাদা, প্রতিটির কারণ ও তারিখ; বাকি জরিমানায় \"💸 পরিশোধ করুন\" চাপলে টাকা পাঠানোর ফর্মে সেটি বাছাই হয়ে খোলে; টাকা পাঠিয়ে থাকলে ⏳ যাচাইয়ের অপেক্ষায়; বাতিল/মাফ হওয়া জরিমানা কারণসহ নিচে।","সবশেষে \"📄 বছরের বিবরণী (PDF)\" — পুরো বছরের হিসাব এক পাতায়।"]],"en":["See your account & share",["Menu → \"👤 My account\".","At the top \"📷 My photo\", then total paid, expected and balance.","12-month bars: height = total paid that month (regular + special); green = full, yellow = partial, red = due.","Below: \"➕ My extra contribution\", \"🔁 Share transfer\" if any, \"🏛️ My share\" and \"⚖️ My fines\" — due and paid shown separately, each with reason and date; \"💸 Pay now\" opens the payment form with that fine selected; ⏳ = sent, awaiting check; cancelled/waived fines listed below with reason.","At the end \"📄 Annual statement (PDF)\" — the whole year on one page."]]},[["menu","#side [data-t=me]","মেনু থেকে \"👤 আমার হিসাব\" খুলুন।","Open \"👤 My account\" from the menu."],["me",".mc","এখানে আপনার মোট জমা, বাকি আর মাসভিত্তিক হিসাব।","Your total, balance and month-by-month record."]],"mmine"],
["online","🟢","g",{"bn":["কে অনলাইনে আছেন",["কারো ছবির কোণে সবুজ বিন্দু থাকলে তিনি এখন অ্যাপে আছেন।","ড্যাশবোর্ডে \"🟢 এখন অনলাইন\" ক্লিক করলে সবার তালিকা দেখাবে — কে অ্যাপে আছেন, কে কখন শেষ খুলেছিলেন।","\"👥 সদস্য\" পাতায় অনলাইনে থাকা সদস্যরা উপরে থাকেন, নামের নিচে \"শেষ দেখা\" লেখা থাকে।","সবুজ বিন্দুতে ক্লিক করলে লেখা দেখাবে।","অ্যাপ খোলা থাকলেই অনলাইন দেখায়; বন্ধ করলে ২ মিনিটের মধ্যে চলে যায়।"]],"en":["Who's online",["A green dot on someone's avatar means they are in the app now.","On the dashboard click \"🟢 Online now\" to see everyone — who is in the app and when others last opened it.","On \"👥 Members\" online members are listed first, with \"Last seen\" under the name.","Click a green dot to see the label.","You show as online while the app is open; it disappears within 2 minutes after closing."]]},[["home","#onl","এখানে দেখবেন এখন কতজন অ্যাপে আছেন। ক্লিক করলে সবার তালিকা খুলবে।","See how many are in the app now. Click to open the list."],["mem",".mc .mh","সবুজ বিন্দু = এখন অ্যাপে আছেন। নামের নিচে শেষ কখন খুলেছিলেন লেখা থাকে।","Green dot = in the app now. Below the name: when they were last seen."]],"monl"],
["vbadge","✔️","g",{"bn":["নামের পাশের চিহ্ন (ব্যাজ)",["🟡 সোনালি চিহ্ন = অ্যাডমিন, 🟣 বেগুনি চিহ্ন = ক্যাশিয়ার।","🔵 নীল চিহ্ন = যাচাইকৃত সদস্য। সদস্যের তথ্যের সব ঘর (ইমেইল ছাড়া) পূরণ থাকলে নীল চিহ্ন আসে।","লাগবে: পূর্ণ নাম, পিতার নাম, মাতার নাম, বর্তমান ও স্থায়ী ঠিকানা, জন্ম তারিখ, পেশা, NID/পাসপোর্ট, মোবাইল, যোগদানের তারিখ ও মাসিক চাঁদা। শুধু \"-\" বা \"নেই\" লিখলে খালি ধরা হয়।","নীল চিহ্ন না থাকলে অ্যাডমিনকে আপনার বাকি তথ্য দিন — অ্যাডমিন প্যানেল → সদস্যের তথ্যে বসালেই চিহ্ন চলে আসবে।","চিহ্নে ক্লিক করলে লেখা দেখাবে।"]],"en":["Badges next to names",["🟡 Gold = Admin, 🟣 Purple = Cashier.","🔵 Blue = verified member. It appears when every member-info field (except email) is filled.","Needed: full name, father's and mother's name, present and permanent address, date of birth, occupation, NID/passport, mobile, join date and monthly amount. Just \"-\" or \"none\" counts as empty.","No blue badge? Give your missing details to the admin — once entered in the admin panel's member info, the badge appears.","Click a badge to see its label."]]},null],
["ntf","🔔","g",{"bn":["ফোনে নোটিফিকেশন চালু ও বন্ধ",["ড্যাশবোর্ডে \"🔔 নোটিফিকেশন চালু করুন\" কার্ডে \"চালু করুন\" ক্লিক করুন, অথবা মেনু → \"🔔 নোটিফিকেশন\"।","ফোন অনুমতি চাইলে \"Allow\" দিন। এরপর অ্যাপ বন্ধ থাকলেও নতুন নোটিশ, ভোট আর টাকা জমার খবর ফোনে আসবে।","\"🧪 পরীক্ষা করুন\" ক্লিক করলে এই ফোনে একটা পরীক্ষামূলক নোটিফিকেশন আসবে।","\"কোন খবর পাবেন\" অংশে যেটা চান না সেটা বন্ধ করুন। 🔒 চিহ্ন দেওয়াগুলো অ্যাডমিন সবসময় চালু রেখেছেন — বন্ধ করা যায় না। ফোনে একবার নোটিফিকেশন চালু করলে অ্যাপ থেকে আর বন্ধ করা যায় না।","ভুল করে \"Block\" দিয়ে থাকলে ফোনের Settings → Apps → UIF → Notifications → Allow দিন।","নোটিফিকেশনে ক্লিক করলে অ্যাপের ঠিক সেই পাতা খুলবে।"]],"en":["Turn phone notifications on & off",["Click \"Turn on\" on the dashboard card, or Menu → \"🔔 Notifications\".","When the phone asks, click \"Allow\". Notices, votes and payment updates will then arrive even when the app is closed.","Click \"🧪 Test\" to get a test notification on this phone.","Under \"What you'll get\" turn off anything you don't want. Items marked 🔒 are kept on by the admin and can't be turned off. Once turned on for a phone, notifications can't be turned off from the app.","If you clicked \"Block\" by mistake: phone Settings → Apps → UIF → Notifications → Allow.","Clicking a notification opens the right page of the app."]]},[["menu","#side [data-t=ntf]","মেনু থেকে \"🔔 নোটিফিকেশন\" খুলুন।","Open \"🔔 Notifications\" from the menu."],["ntf",".nps","এখানে দেখবেন এই ফোনে নোটিফিকেশন চালু কিনা। বন্ধ থাকলে নিচের বাটনে চালু করুন।","See whether notifications are on for this phone, and turn them on below."],["ntf","#npt","কোন কোন খবর পাবেন এখানে বেছে নিন।","Choose which updates you get."]],"mntf"],
["vote","🗳️","g",{"bn":["কীভাবে ভোট দেবেন",["নতুন ভোট এলে ড্যাশবোর্ডে পপআপ ও সোনালি সারি আসে।","পপআপ থেকে সরাসরি, বা মেনু → \"🗳️ ভোট\" থেকে অপশন ক্লিক করুন।","নিশ্চিত করুন — একবার ভোট দিলে আর বদলানো যায় না।","ভোট দেওয়ার পর ফলাফল দেখতে পাবেন।"]],"en":["How to vote",["A popup and a gold bar appear on the dashboard for new votes.","Click an option there or in Menu → \"🗳️ Votes\".","Confirm — a vote cannot be changed later.","Results appear after you vote."]]},[["menu","#side [data-t=vote]","মেনু থেকে \"🗳️ ভোট\" খুলে অপশন ক্লিক করুন। পাশের লাল সংখ্যা = বাকি ভোট।","Open \"🗳️ Votes\" and click an option. The red number = votes pending."]],"mvote"],
["read","📣","g",{"bn":["নোটিশ ও নিয়মকানুন পড়া",["মেনু → \"📣 নোটিশ\" বা \"📜 নিয়মকানুন\"। নতুন কিছু থাকলে মেনুতে নামের পাশে লাল সংখ্যা দেখায়।","ড্যাশবোর্ডের \"📌 করণীয়\" অংশেও নতুন নোটিশ বা নিয়ম দেখায় — চাপলে সেখানে নিয়ে যায়।","পড়া শেষে \"✓ পড়েছি\" ক্লিক করুন, সংখ্যা কমে যাবে।","ওপরের 🔔 বেল এখন \"📬 নোটিফিকেশন সেন্টার\" খোলে — সেখানে সব নোটিফিকেশন একসাথে থাকে।"]],"en":["Reading notices & rules",["Menu → \"📣 Notices\" or \"📜 Rules\". A red number next to the name means something new.","The dashboard \"📌 To do\" section also lists new notices or rules — tap to go there.","Click \"✓ Read\" after reading; the number goes down.","The 🔔 bell at the top now opens the \"📬 Notification center\", which keeps all notifications together."]]},[["menu","#side [data-t=not]","মেনুর \"📣 নোটিশ\" ও \"📜 নিয়মকানুন\"-এর পাশে লাল সংখ্যা মানে নতুন কিছু আছে।","A red number next to \"📣 Notices\" or \"📜 Rules\" means something new."]],"mread"],
["pdf","📄","g",{"bn":["PDF রিপোর্ট বানানো ও শেয়ার",["মেনু → \"📄 PDF রিপোর্ট\"।","এক বা একাধিক মাস বাছাই করুন। ওপরে বাছাই করা মাসের সারাংশ দেখায়।","\"PDF তৈরি ও শেয়ার করুন\" ক্লিক করুন — \"আগে দেখে নিন\" চালু থাকলে আগে প্রিভিউ দেখাবে।","\"⬇️ ফোনে সেভ করুন\" দিলে সরাসরি Downloads-এ যাবে, \"📤 শেয়ার\" দিয়ে WhatsApp-এ পাঠানো যায়। ইন্টারনেট লাগবে।","একই পাতায় নিচে \"⚖️ Balance Sheet ও আয়-ব্যয়\" আর (অ্যাডমিন/ক্যাশিয়ার) \"সদস্যের বার্ষিক বিবরণী\" আছে।"]],"en":["Create & share a PDF report",["Menu → \"📄 PDF report\".","Pick one or more months. A summary of the chosen months shows above.","Click \"Create & share PDF\" — with \"Preview first\" on, a preview opens.","\"⬇️ Save to phone\" saves it to Downloads; \"📤 Share\" sends it on WhatsApp. Needs internet.","Further down the same page: \"⚖️ Balance Sheet & income-expense\" and (admin/cashier) \"Member annual statement\"."]]},[["menu","#side [data-t=rep]","মেনু থেকে \"📄 PDF রিপোর্ট\" খুলে মাস বাছাই করুন।","Open \"📄 PDF report\" and pick months."]],"mpdf"],
["stmt","📄","g",{"bn":["বছরের বিবরণী (PDF) নামানো",["মেনু → \"👤 আমার হিসাব\" → নিচে \"📄 বছরের বিবরণী (PDF)\"।","আগের বছরের হিসাব থাকলে বছর বাছাই করুন।","\"📄 বিবরণী তৈরি করুন\" ক্লিক করুন — আগে প্রিভিউ দেখাবে।","\"⬇️ ফোনে সেভ করুন\" দিয়ে সরাসরি Downloads-এ রাখুন, বা \"📤 শেয়ার\" দিয়ে WhatsApp-এ পাঠান।","এতে থাকে: মাসভিত্তিক জমা (কবে ও কীভাবে), জরিমানা, বছরের মোট আর ফাউন্ডেশনে আপনার অংশ। অ্যাপ থেকে তৈরি, তাই স্বাক্ষর লাগে না।","অ্যাডমিন ও ক্যাশিয়ার: \"📄 PDF রিপোর্ট\" পাতার \"সদস্যের বার্ষিক বিবরণী\" অংশ থেকে যেকোনো সদস্যের বিবরণী বানাতে পারবেন।"]],"en":["Download your annual statement (PDF)",["Menu → \"👤 My account\" → \"📄 Annual statement (PDF)\" at the bottom.","Pick the year if older years exist.","Click \"📄 Create statement\" — a preview opens.","\"⬇️ Save to phone\" saves it to Downloads; \"📤 Share\" sends it on WhatsApp.","It shows month-by-month payments (when & how), fines, yearly totals and your foundation share. Made by the app, so no signature is needed.","Admin & cashier: the \"Member annual statement\" section of \"📄 PDF report\" makes a statement for any member."]]},[["menu","#side [data-t=me]","মেনু থেকে \"👤 আমার হিসাব\" খুলুন।","Open \"👤 My account\"."],["me","#ysc","নিচের এই কার্ড থেকে বছরের বিবরণী বানান।","Create your annual statement from this card."]],null],
["slow","📶","g",{"bn":["অ্যাপ ধীর, তথ্য আসছে না, বা আপডেট দেখছেন না",["ওপরে \"সংযোগ হচ্ছে…\" বা \"ইন্টারনেট সংযোগ নেই\" পট্টি দেখালে চিন্তা নেই — আপনার শেষ তথ্য দেখানো হয়, অ্যাপ প্রতি ৩০ সেকেন্ডে নিজে আবার চেষ্টা করে। চাইলে ↻ চাপুন।","সাধারণত এর কারণ ইন্টারনেট না থাকা বা সার্ভার আপডেট চলা — ইন্টারনেট সংযোগ দেখুন।","\"🛠️ রক্ষণাবেক্ষণ চলছে\" দেখালে কিছু করতে হবে না — কাজ শেষ হলে অ্যাপ নিজে খুলবে।","নতুন সংস্করণ এলে নিচে \"আপডেট করুন\" বার্তা আসে — চাপলেই নতুনটা খোলে। তবুও পুরোনো দেখালে অ্যাপ পুরোপুরি বন্ধ করে আবার খুলুন।","মেনুর একদম নিচে অ্যাপের সংস্করণ (UIF অ্যাপ · vNN) লেখা থাকে — সমস্যা জানাতে সেটা বলুন।"]],"en":["App slow, no data or no update",["If a bar says \"Connecting…\" or \"No internet connection\", don't worry — your last data is shown and the app retries every 30 seconds by itself. Tap ↻ if you like.","Usually it means no internet or a server update in progress — check your connection.","If it shows \"🛠️ Under maintenance\", do nothing — the app opens by itself when the work is done.","When a new version arrives an \"Update\" message appears at the bottom — tap it. If you still see the old one, close the app fully and reopen.","The app version (UIF app · vNN) is at the very bottom of the menu — mention it when reporting a problem."]]},null,null],
["bank","🏛️","g",{"bn":["ব্যাংকে জমা দেখা",["ক্যাশিয়ার হাতের টাকা ফাউন্ডেশনের ব্যাংক অ্যাকাউন্টে জমা দিলে অ্যাপে রশিদের ছবিসহ লিখে রাখেন।","মেনু → \"🏛️ ব্যাংক অ্যাকাউন্ট\" — ওপরে ব্যাংকে মোট, হাতের টাকা ও জমার সংখ্যা; নিচে প্রতিটি জমার তালিকা।","\"📒 আয়-ব্যয়\" পাতায় \"🏛️ ব্যাংক\" ঘরে চাপলেও এই পাতা খোলে।","জমার পাশে \"🧾 রশিদ\" ক্লিক করলে রশিদের ছবি দেখা যায়।","ব্যাংকে জমা দিলে মোট ফান্ড বদলায় না — শুধু টাকা হাত থেকে ব্যাংকে যায়।"]],"en":["Viewing bank deposits",["When the cashier deposits cash into the foundation bank account, it is recorded in the app with the receipt photo.","Menu → \"🏛️ Bank account\" — the bank total, cash in hand and number of deposits at the top; each deposit below.","Tapping the \"🏛️ Bank\" box on the \"📒 Income & expense\" page also opens it.","Click \"🧾 Receipt\" on a deposit to see the receipt photo.","A bank deposit does not change the total fund — the money just moves from hand to bank."]]}],
["badge","🏅","g",{"bn":["আমার ধারা ও ব্যাজ",["মেনু → \"👤 আমার হিসাব\" → \"🏅 আমার ধারা ও ব্যাজ\"।","গোনা শুরু ডিসেম্বর ২০২৬ থেকে। শেষ সময়ের মধ্যে পুরো চাঁদার তথ্য দিলে ও যাচাই হলে মাসটি সময়মতো ধরা হয়।","ব্যাজ: প্রথম জমা, টানা ৩, ৬ ও ১২ মাস; ২০২৭ থেকে পুরো বছরের ব্যাজ।","কোনো মাস দেরি হলে চলতি ধারা আবার শূন্য থেকে শুরু হয়; আগে পাওয়া ব্যাজ থাকে।","নতুন ব্যাজ পেলে অভিনন্দন পপআপ আসে।"]],"en":["My streak & badges",["Menu → \"👤 My account\" → \"🏅 My streak & badges\".","Counting starts in December 2026. A month is on time when the full contribution is reported before your deadline and then verified.","Badges: first payment, 3, 6 and 12 months in a row; a full-year badge from 2027.","A late month resets the current streak to zero; badges already earned stay.","A congratulations popup appears when you earn a new badge."]]}],
["yrv","✨","g",{"bn":["আমার UIF বছর",["প্রতি বছর ১৫ ডিসেম্বর থেকে জানুয়ারির শেষ পর্যন্ত দেখা যায়।","ড্যাশবোর্ডে বা \"👤 আমার হিসাব\"-এ \"✨ আমার UIF বছর\" কার্ডে ক্লিক করুন।","আপনার বছরের হিসাব গল্পের মতো একটার পর একটা পাতায় দেখাবে।"]],"en":["My UIF Year",["Available every year from 15 December to the end of January.","Click the \"✨ My UIF Year\" card on the dashboard or in \"👤 My account\".","Your year is shown as a story, one page after another."]]}],
["lang","🌐","g",{"bn":["ভাষা বদলানো",["মেনু খুলুন।","নিচে \"🌐 ভাষা\" সারিতে বাংলা বা English ক্লিক করুন।"]],"en":["Change language",["Open the menu.","In the \"🌐 Language\" row click বাংলা or English."]]},[["menu","#side .lng","এখানে বাংলা বা English ক্লিক করুন।","Click বাংলা or English here."]],"mlang"],
["c_ver","🗂️","c",{"bn":["রিকোয়েস্ট যাচাই করা",["মেনু → \"🗂️ ক্যাশিয়ার প্যানেল\" → \"🗂️ রিকোয়েস্ট\" ট্যাব।","প্রতিটি রিকোয়েস্টে রঙিন চিহ্নে দেখা যায় সদস্য কীভাবে দিয়েছেন: বিকাশ, নগদ, না ক্যাশ।","বিকাশ/নগদ হলে নিজের হিস্ট্রির সাথে শেষ ৪ সংখ্যা, টাকা আর তারিখ মেলান। ক্যাশ হলে হাতে পাওয়া টাকার সাথে মেলান।","🏦 ব্যাংক হলে \"🧾 রশিদ দেখুন\" ক্লিক করুন — দুই আঙুলে জুম করে রশিদের টাকা ও তারিখ বিকাশে আসা টাকার সাথে মেলান (প্রণোদনার বাড়তি টাকা ধরা হয় না)। \"💾 সেভ\" দিয়ে ছবি ফোনে রাখা যায়। \"⚠️ দেখতে প্রায় একই\" লেখা থাকলে \"মিলিয়ে দেখুন\" ক্লিক করে আগের রশিদের সাথে তুলনা করুন।","মিললে \"✅ জমা হয়েছে\", না মিললে \"❌ হয়নি\" ক্লিক করুন।","⚠️ = টাকা মিলছে না, ⏰ = ২৪ ঘণ্টার বেশি পেন্ডিং।"]],"en":["Verifying requests",["Menu → \"🗂️ Cashier panel\" → \"🗂️ Requests\" tab.","A coloured chip shows how the member paid: bKash, Nagad or Cash.","For bKash/Nagad match the last 4 digits, amount and date with your history. For cash, match the money you received.","For 🏦 Bank click \"🧾 View receipt\" — pinch to zoom and match the amount and date with what arrived in bKash (remittance incentive is not counted). \"💾 Save\" keeps the photo on your phone. If it says \"⚠️ Looks almost the same\", click \"Compare\" to check the earlier receipt.","Click \"✅ Got it\" if it matches, otherwise \"❌ Not got\".","⚠️ = amount mismatch, ⏰ = pending over 24 h."]]},[["cash",".py","প্রতিটি রিকোয়েস্টে মাধ্যম, শেষ ৪ সংখ্যা, টাকা আর তারিখ মিলিয়ে জমা/হয়নি ক্লিক করুন।","Check the method, last 4 digits, amount and date, then mark it."]],"mcas"],
["c_bd","🏛️","c",{"bn":["ব্যাংকে জমা লেখা",["ক্যাশিয়ার প্যানেল → \"🏛️ ব্যাংক জমা\" ট্যাব।","টাকার অঙ্ক, তারিখ, ইচ্ছা হলে নোট দিন আর রশিদের ছবি যোগ করুন (ছবি লাগবেই)।","\"✓ জমা করুন\" ক্লিক করে নিশ্চিত করুন। হাতের নগদের চেয়ে বেশি জমা দেওয়া যায় না।","সদস্যরা \"🏛️ ব্যাংক অ্যাকাউন্ট\" পাতায় জমা ও রশিদ দেখতে পান।","অ্যাডমিন রশিদ মিলিয়ে \"✓ যাচাই\" করেন; ভুল হলে \"↩️ বাতিল\", পরে চাইলে মুছতে পারেন।"]],"en":["Recording a bank deposit",["Cashier panel → \"🏛️ Bank deposit\" tab.","Enter the amount, date, an optional note, and add the receipt photo (required).","Click \"✓ Save deposit\" and confirm. You cannot deposit more than the cash in hand.","Members see the deposit and receipt on the \"🏛️ Bank account\" page.","The admin checks the receipt and clicks \"✓ Verify\"; a wrong entry can be voided with \"↩️ Void\" and later deleted."]]}],
["c_cash","💵","c",{"bn":["ক্যাশ জমা এন্ট্রি",["হাতে হাতে টাকা নিলে ক্যাশিয়ার প্যানেল → \"💵 ক্যাশ জমা\" ট্যাব খুলুন।","সদস্য, মাস (বা \"➕ অতিরিক্ত চাঁদা\") আর টাকা দিন।","\"✓ জমা করুন\" ক্লিক করে নিশ্চিত করুন — সাথে সাথে হিসাবে উঠে যাবে।"]],"en":["Cash entry",["For cash received by hand open Cashier panel → \"💵 Cash entry\" tab.","Choose member, month (or \"➕ Extra contribution\") and amount.","Click \"✓ Add payment\" and confirm — it is counted immediately."]]},[["cash","#k_who","সদস্য বাছাই করে মাস ও টাকা দিন, তারপর জমা করুন।","Choose the member, month and amount, then add."]],null],
["c_num","📲","c",{"bn":["টাকা পাঠানোর নাম্বার বদলানো",["মেনু → \"🗂️ ক্যাশিয়ার প্যানেল\" → \"⚙️ অন্যান্য\" ট্যাব → \"📲 টাকা পাঠানোর নাম্বার\"।","নাম্বারটি কিসের — বিকাশ, নগদ, না দুটোই — বাছাই করুন।","বিকাশ/নগদ নাম্বার লিখুন (০১ দিয়ে ১১ সংখ্যা)।","WhatsApp আলাদা নাম্বারে হলে সেটা দিন; বিদেশি নাম্বার হলে + দিয়ে দেশের কোডসহ, যেমন +966 55 123 4567। খালি রাখলে উপরের নাম্বারেই WhatsApp যাবে।","ক্যাশিয়ার \"রিকোয়েস্ট পাঠান\" ক্লিক করুন — অ্যাডমিন অনুমতি দিলে তবেই নাম্বার বদলাবে। অ্যাডমিন নিজে \"✓ সেভ করুন\" দিলে সাথে সাথে বদলায়।"]],"en":["Change the payment number",["Menu → \"🗂️ Cashier panel\" → \"⚙️ Other\" tab → \"📲 Payment number\".","Choose the type — bKash, Nagad or both.","Enter the bKash/Nagad number (11 digits starting with 01).","If WhatsApp is on another number, enter it; for a foreign number use + and the country code, e.g. +966 55 123 4567. Leave empty to use the number above.","The cashier clicks \"Send request\" — the number changes only after the admin approves. When the admin clicks \"✓ Save\" it changes right away."]]},[["cash","#pic","এখানে নাম্বারের ধরন, নাম্বার আর WhatsApp দিয়ে সেভ করুন।","Set the type, number and WhatsApp here, then save."]],null],
["c_rem","💬","c",{"bn":["WhatsApp রিমাইন্ডার পাঠানো",["ক্যাশিয়ার প্যানেল → \"⚙️ অন্যান্য\" ট্যাব → \"📲 WhatsApp রিমাইন্ডার\"।","এ মাসে যাঁদের চাঁদা বা জরিমানা বাকি, তাঁদের তালিকা দেখাবে — কত বাকি, আংশিক কি না।","নামের পাশে 💬 ক্লিক করলে বার্তা লেখা অবস্থায় WhatsApp খুলবে, শুধু পাঠান ক্লিক করুন।","পাঠানোর পর নামের নিচে \"✓ আজ পাঠানো হয়েছে\" দেখাবে, যাতে একজনকে দুবার না পাঠান।","⚠️ \"দেশের কোড দিন\" দেখালে ওই সদস্যের মোবাইল নাম্বারে কোড নেই — অ্যাডমিন ঠিক করে দেবেন।"]],"en":["Sending WhatsApp reminders",["Cashier panel → \"⚙️ Other\" tab → \"📲 WhatsApp reminders\".","It lists members with contribution or fines due this month — how much, and whether partly paid.","Click 💬 next to a name: WhatsApp opens with the message ready, just click send.","Afterwards \"✓ Sent today\" appears under the name so you don't send twice.","⚠️ \"Add country code\" means that member's number has no code — the admin can fix it."]]},[["cash","#rmc","এখানে বাকি থাকা সদস্যদের তালিকা। 💬 ক্লিক করলে WhatsApp-এ বার্তা তৈরি থাকবে।","Members with dues. Click 💬 and the WhatsApp message is ready."]],"mrem"],
["m_ved","✏️","a",{"bn":["ভোট সম্পাদনা",["অ্যাডমিন প্যানেল → \"📣 নোটিশ\" → যে ভোট বদলাবেন তার পাশে ✏️ ক্লিক করুন।","প্রশ্ন, বিস্তারিত, অপশন, পাসের নিয়ম আর শেষ তারিখ — সবকিছু যেকোনো সময় বদলানো যায়, ভোট চলাকালীনও।","অপশনের নাম বা ক্রম বদলালে আগের ভোট সঠিক অপশনেই থাকে।","কোনো অপশন মুছে দিলে সেটির ভোট বাতিল হয়, তাঁরা আবার ভোট দিতে পারবেন। সেভের আগে অ্যাপ জানিয়ে দেবে।","সম্পাদিত ভোটে সবার কাছে \"✏️ সম্পাদিত\" চিহ্ন দেখায়।"]],"en":["Editing a vote",["Admin panel → \"📣 Notices\" → click ✏️ next to the vote.","Question, details, options, pass rule and end date can all be changed any time, even while voting is open.","Renaming or reordering options keeps existing votes on the right option.","Removing an option cancels its votes so those members can vote again. The app warns you before saving.","Edited votes show an \"✏️ Edited\" mark to everyone."]]},[["admin:not","#ed_v","ভোটের পাশে ✏️ ক্লিক করলে এই ফর্মে সব আগের মতো ভরা থাকবে — বদলে সেভ করুন।","Click ✏️ on a vote and this form is filled in — change and save."]],null],
["a_phone","📞","a",{"bn":["বিদেশি মোবাইল নাম্বার লেখা",["অ্যাডমিন প্যানেল → 👥 সদস্য → \"সদস্যের তথ্য\" → সদস্য বাছাই করুন।","বাংলাদেশি নাম্বার হলে 01… লিখলেই চলবে।","বিদেশে থাকা সদস্যের নাম্বার + দিয়ে দেশের কোডসহ লিখুন, যেমন: +966 55 123 4567।","কোড না থাকলে WhatsApp রিমাইন্ডার পাঠানো যাবে না, তালিকায় ⚠️ দেখাবে।"]],"en":["Writing foreign mobile numbers",["Admin panel → 👥 Members → \"Member details\" → choose the member.","A Bangladeshi number can be written as 01….","For members abroad write + and the country code, e.g. +966 55 123 4567.","Without a code WhatsApp reminders can't be sent and ⚠️ is shown."]]},[["admin:mem","#im_8","মোবাইল নাম্বার এখানে। বিদেশি হলে + দিয়ে দেশের কোডসহ লিখুন।","The mobile number goes here. For foreign numbers add + and the country code."]],null],
["a_mem","👥","a",{"bn":["নতুন সদস্য ও লগইন",["অ্যাডমিন প্যানেল → 👥 সদস্য → \"👥 সদস্য তালিকা\" কার্ডে নাম ও নাম সংখ্যা (শেয়ার) দিয়ে যোগ করুন। পরের সদস্য আইডি (M-…) নিজে থেকে বসে।","\"🔐 ব্যবহারকারী ও পাসওয়ার্ড\" কার্ডে \"＋ নতুন ব্যবহারকারী\" → সদস্য, ইউজারনেম (ইংরেজি ছোট হাতের অক্ষর/সংখ্যা, ৩–২০ অক্ষর) ও একটি অস্থায়ী পাসওয়ার্ড দিন।","সদস্যকে ইউজারনেম ও অস্থায়ী পাসওয়ার্ড জানান। প্রথম লগইনে অ্যাপ তাঁকে নিজের পাসওয়ার্ড দিতে বাধ্য করবে।","তালিকায় \"⏳ অস্থায়ী পাসওয়ার্ড\" দেখালে সদস্য এখনো নিজের পাসওয়ার্ড দেননি; \"🔒\" মানে দিয়েছেন।","কারো শেয়ার অন্যকে দিতে হলে নাম বদলাবেন না — \"🔁 শেয়ার (নাম) হস্তান্তর\" ব্যবহার করুন।"]],"en":["New member & login",["Admin panel → 👥 Members → \"👥 Member list\" card: add the name and number of shares. The next member ID (M-…) is set automatically.","In \"🔐 Users & passwords\" → \"＋ New user\": choose the member, a username (lowercase English letters/digits, 3–20) and a temporary password.","Give the member the username and temporary password. At first login the app forces them to set their own.","\"⏳ Temporary password\" in the list means they haven't set their own yet; \"🔒\" means they have.","To give someone's share to another person don't rename — use \"🔁 Share transfer\"."]]},null,null],
["a_rst","🔑","a",{"bn":["কারো পাসওয়ার্ড রিসেট",["অ্যাডমিন প্যানেল → 👥 সদস্য → \"🔐 ব্যবহারকারী ও পাসওয়ার্ড\" → ব্যবহারকারীর পাশে ⚙️।","\"🔑 পাসওয়ার্ড\" → নতুন অস্থায়ী পাসওয়ার্ড লিখে \"✓ সেভ করুন\"।","সাথে সাথে ওই ব্যবহারকারী সব ডিভাইস থেকে লগআউট হবেন। অস্থায়ী পাসওয়ার্ডটি তাঁকে জানান — লগইন করলে অ্যাপ নিজের পাসওয়ার্ড দিতে বলবে।","কারো পাসওয়ার্ড অ্যাপে বা Sheet-এ খোলা অবস্থায় দেখা যায় না — শুধু রিসেট করা যায়।"]],"en":["Reset someone's password",["Admin panel → 👥 Members → \"🔐 Users & passwords\" → ⚙️ next to the user.","\"🔑 Password\" → type a new temporary password → \"✓ Save\".","They are logged out of all devices at once. Give them the temporary password — at login the app asks them to set their own.","Passwords can't be viewed in the app or the Sheet — only reset."]]},null,null],
["a_srv","🛠️","a",{"bn":["অ্যাডমিন: এক বাটনে সার্ভার আপডেট",["নতুন সংস্করণ এলে Claude পুরো ৬৪ অক্ষরের সংস্করণ নম্বর দেবে।","অ্যাডমিন প্যানেল → 🛡️ সিস্টেম → \"🛠️ সার্ভার আপডেট\" → নম্বরটা বসিয়ে \"⬆️ আপডেট করুন\"। Deploy লাগে না।","সমস্যা হলে \"↩️ আগের সংস্করণে ফিরুন\"। নতুন সংস্করণ চালু হতেই ভাঙলে সার্ভার নিজেই আগেরটায় ফেরে।","অ্যাপই না খুললে: Apps Script খুলে uifRollback Run করুন — আগের সংস্করণে ফিরবে।","প্রতিটি বদল কার্যক্রমের লগে থাকে, আর অ্যাডমিন নোটিফিকেশন পান।"]],"en":["Admin: one-tap server update",["For a new version Claude gives the full 64-character version number.","Admin panel → 🛡️ System → \"🛠️ Server update\" → paste it and tap \"⬆️ Update\". No Deploy needed.","If something is wrong, tap \"↩️ Back to previous version\". If a new version fails to start, the server returns to the previous one by itself.","If the app does not open at all: open Apps Script and Run uifRollback.","Every change is in the activity log and the admin is notified."]]},null,null],
["a_due","⭐","a",{"bn":["অ্যাডমিন: মাসিক বিশেষ চাঁদা ও জরিমানার নিয়ম",["অ্যাডমিন প্যানেল → ⚙️ সেটিং → \"⭐ মাসিক বিশেষ চাঁদা ও জরিমানার নিয়ম\"।","একাধিক সময়কাল রাখা যায়: প্রতিটিতে বিশেষ হার (প্রতি নামে), শুরু ও শেষ মাস। কোনো মাস কোনো সময়কালে না পড়লে সে মাসে বিশেষ চাঁদা নেই।","জরিমানার নিয়ম বছর ধরে: \"নাম প্রতি\" (যেমন ২০২৬-এ ২০০ ৳) বা \"বাকি টাকার %\" (২০২৭-এ ১০%)।","\"✓ সংরক্ষণ\" চাপুন। পুরোনো জমা বা আগে বসানো জরিমানা বদলায় না।"]],"en":["Admin: monthly special contribution & fine rules",["Admin panel → ⚙️ Settings → \"⭐ Monthly special contribution & fine rules\".","You can keep several periods: each with a special rate (per share), start and end month. A month in no period has no special contribution.","Fine rule per year: \"per share\" (e.g. ৳ 200 in 2026) or \"% of unpaid\" (10% in 2027).","Click \"✓ Save\". Past payments and existing fines do not change."]]},null,null],
["a_fine","🤖","a",{"bn":["স্বয়ংক্রিয় জরিমানা",["প্রত্যেকের শেষ সময় নিজের দেশের ৫ তারিখ রাত ১২টা (তথ্য দেওয়ার সময় ফোনের সময় অঞ্চল দেখে)। জরিমানা বসে সৌদি রাত ১২টার পর, মাসে একবার; নিষ্ক্রিয় সদস্য বাদ।","ফোনের সময় বদলালেও সৌদি রাত ১২টার বেশি সময় পাওয়া যায় না। ক্যাশ জমায় সৌদি রাত ১২টা ধরা হয়।","শেষ সময়ের আগে পাঠানো রিকোয়েস্ট যাচাই বাকি থাকলে জরিমানা অপেক্ষায় থাকে; \"জমা হয়েছে\" হলে বসে না, \"হয়নি\" হলে বসে। শেষ সময়ের পরে পাঠানো টাকা জরিমানা ঠেকায় না।","অ্যাডমিন একটি সারাংশ নোটিফিকেশন পান (কার কত)।","ক্যাশিয়ারের ভুলে জরিমানা হলে: অ্যাডমিন প্যানেল → 💵 হিসাব → \"🔧 সংশোধন\" → জরিমানার পাশে \"↩️ বাতিল\", কারণ লিখুন। তারপর ধরন বাছুন: \"✅ সদস্যের দোষ ছিল না\" হলে সদস্যের ব্যাজের ধারায় মাসটি সময়মতো ধরা হবে; \"🤝 মানবিক কারণে মাফ\" হলে ধারা ভাঙাই থাকবে। সদস্য শুধু কারণসহ খবর পাবেন; বাতিল করা জরিমানা আর ফিরে আসে না (হাতের \"⚖️ জরিমানা বসান\" চাপলেও না)।","জরিমানার টাকা আগেই জমা হয়ে থাকলে বাতিলের আগে টাকাটা সদস্যকে ফেরত দিন — নইলে অ্যাপের নগদ আর ক্যাশিয়ারের হাতের টাকা মিলবে না। অ্যাপ বাতিলের সময় এটা জিজ্ঞেস করবে।","বিকল্প: 💵 হিসাব → \"🔧 সংশোধন\" → 🤖 থেকে মাস বেছে \"⚖️ জরিমানা বসান\" হাতেও চাপা যায়।"]],"en":["Automatic fines",["Each member's deadline is midnight on the 5th in their own country (from the phone's time zone when reporting). Fines are added after midnight Saudi time, once a month; inactive members are skipped.","Changing the phone's time never gives more than Saudi midnight. Cash entries use Saudi midnight.","If a request sent before the deadline is still pending, the fine waits: verified → no fine, not received → fine. Money sent after the deadline does not prevent a fine.","The admin gets a summary notification.","If a fine is due to a cashier mistake: Admin panel → 💵 Accounts → \"🔧 Corrections\" → \"↩️ Void\" next to the fine, with a reason. Then choose the type: \"✅ Not the member's fault\" counts the month as on time in the member's badge streak; \"🤝 Waived out of kindness\" leaves the streak broken. The member only sees the reason; a voided fine never comes back (not even with \"⚖️ Add fines\").","If the fine was already paid, return the money to the member before voiding — otherwise the app's cash and the cashier's cash will not match. The app asks about this when you void.","Backup: 💵 Accounts → \"🔧 Corrections\" → 🤖, choose the month and click \"⚖️ Add fines\"."]]},null,null],
["a_rtpl","📝","a",{"bn":["রিমাইন্ডারের বার্তা বদলানো",["মেনু → \"🗂️ ক্যাশিয়ার প্যানেল\" → \"⚙️ অন্যান্য\" → \"📲 WhatsApp রিমাইন্ডার\" কার্ডের নিচে \"✏️ বার্তা বদলান\"।","বার্তা নিজের মতো লিখুন। {নাম}, {মাস}, {টাকা}, {বিস্তারিত} এর মতো ঘর রাখলে অ্যাপ প্রত্যেকের তথ্য নিজে বসাবে।","নিচে একজন সদস্যের নমুনা বার্তা দেখাবে — যেমন যাবে ঠিক তেমন।","\"✓ সেভ\" ক্লিক করুন। আগের লেখায় ফিরতে \"↺ আগের লেখায় ফিরুন\"।"]],"en":["Editing the reminder message",["Menu → \"🗂️ Cashier panel\" → \"⚙️ Other\" → \"✏️ Edit message\" at the bottom of the \"📲 WhatsApp reminders\" card.","Write it your way. Fields like {নাম}, {মাস}, {টাকা}, {বিস্তারিত} are filled in for each member.","A preview below shows exactly what a member will get.","Click \"✓ Save\". Use \"↺ Restore default\" to go back."]]},[["admin:acc","#rmc .rte","এখানে ক্লিক করে বার্তা বদলান। নিচে নমুনা দেখে নিন।","Click here to edit the message and check the preview."]],"mrem"],
["a_req","🗂️","a",{"bn":["অ্যাডমিন: রিকোয়েস্ট বদল, বাতিল ও মোছা",["ক্যাশিয়ার প্যানেল → \"🗂️ রিকোয়েস্ট\" — কার্ডের \"🛡️ শুধু অ্যাডমিন\" অংশে অপশনগুলো থাকে।","ক্যাশিয়ার একবারই সিদ্ধান্ত দিতে পারেন; অ্যাডমিন পরে \"✅ জমা হয়েছে\" বা \"❌ হয়নি\" বদলাতে পারেন।","\"↩️ বাতিল\" দিলে কারণ লিখুন — রিকোয়েস্ট কারণসহ থাকে; জমা হয়ে থাকলে হিসাব থেকে বাদ যায়।","বাতিল বা \"হয়নি\" রিকোয়েস্ট \"🗑️ মুছুন\" দিয়ে পুরো মোছা যায়।"]],"en":["Admin: Change, void or delete a request",["Cashier panel → \"🗂️ Requests\" — the options are in the admin-only box on each card.","The cashier decides only once; the admin can later change it between \"✅ Got it\" and \"❌ Not got\".","\"↩️ Void\" asks for a reason — the request stays with it; if it was paid, it is removed from the accounts.","Voided or \"Not got\" requests can be removed completely with \"🗑️ Delete\"."]]}],
["a_pinum","📲","a",{"bn":["অ্যাডমিন: নাম্বার বদলের অনুমতি",["ক্যাশিয়ার নাম্বার বদলের রিকোয়েস্ট পাঠালে আপনি নোটিফিকেশন পাবেন।","ক্যাশিয়ার প্যানেল → \"⚙️ অন্যান্য\" → \"📲 টাকা পাঠানোর নাম্বার\"-এ \"অনুমতির অপেক্ষায়\" বাক্স দেখুন।","নাম্বার মিলিয়ে \"✓ অনুমতি দিন\" বা \"✕ প্রত্যাখ্যান\" ক্লিক করে নিশ্চিত করুন।","অনুমতি দিলে সব সদস্য নতুন নাম্বার জানতে পারেন; প্রত্যাখ্যান করলে আগের নাম্বারই থাকে।"]],"en":["Admin: Approving a number change",["You get a notification when the cashier asks to change the number.","Cashier panel → \"⚙️ Other\" → \"📲 Payment number\" shows the pending request.","Check the number, click \"✓ Approve\" or \"✕ Reject\" and confirm.","On approval all members are told the new number; on rejection the old one stays."]]}],
["a_led","📒","a",{"bn":["আয়-ব্যয় এন্ট্রি",["অ্যাডমিন প্যানেল → 💵 হিসাব → \"📒 আয়-ব্যয় এন্ট্রি\"।","ধরন \"আয়\" বা \"ব্যয়\" বাছাই করুন, খাত (যেমন লাভ প্রাপ্তি, ট্যাক্স / চার্জ, সেচ / চাষের খরচ), টাকা, তারিখ ও বিবরণ দিন।","সব টাকা ক্যাশিয়ারের হাতে (নগদ) ধরা হয় — আয় নগদে যোগ হয়, ব্যয় নগদ থেকে কমে। হিসাব খাতায় নিজে থেকে Debit/Credit লেখা হয়।","গিরবির লাভ হলে \"কোন বিনিয়োগ থেকে\" বাছাই করুন। বিনিয়োগে টাকা দিলে এখানে নয়, \"📈 বিনিয়োগ\" কার্ডে যোগ করুন।","ভুল এন্ট্রি মোছা যায় না — ↩️ চেপে কারণ লিখে বাতিল করুন; হিসাব খাতায় উল্টো এন্ট্রি পড়বে।"]],"en":["Income & expense entries",["Admin panel → 💵 Accounts → \"📒 Ledger entry\".","Choose \"Income\" or \"Expense\", a category (e.g. profit received, tax / charge, irrigation / farming), amount, date and note.","All money is treated as cash with the cashier — income adds to cash, expense reduces it. The ledger book records Debit/Credit automatically.","For profit from a mortgage, choose \"From which investment\". Money given to an investment goes in the \"📈 Investments\" card, not here.","Wrong entries can't be deleted — tap ↩️ and give a reason to void; a reverse entry goes into the ledger book."]]},null,null],
["a_ref","↩️","a",{"bn":["প্রাক্তন সদস্যের জমানো টাকা ফেরত দিলে",["এই টাকা ফাউন্ডেশনের আয় বা খরচ নয় — এটা ফেরতযোগ্য দায় (যেমন জিসান খাঁনের সঞ্চয়)। তাই আয়-ব্যয়ে \"ব্যয়\" এন্ট্রি দেবেন না।","টাকা ফেরত দেওয়ার দিনই অ্যাডমিন প্যানেল → 💵 হিসাব → \"🔧 সংশোধন\" → \"🧮 সারাংশের হিসাব\" খুলুন।","\"জিসানের সঞ্চয়\" ঘরে ফেরতের পরে যত বাকি থাকে তা লিখুন (পুরোটা ফেরত দিলে ০) → \"✓ সেভ করুন\"।","এতে নগদ আর দায় দুটোই সমান কমে, উদ্বৃত্ত বদলায় না; হিসাব খাতায় নিজে থেকে ভাউচার পড়ে আর কার্যক্রমের লগে থাকে।","সদস্যদের জানাতে চাইলে একটি নোটিশ দিন।"]],"en":["Refunding a former member's savings",["This money is not the foundation's income or expense — it is a refundable liability (e.g. Jisan Khan's savings). So don't make an \"Expense\" entry.","On the day of the refund open Admin panel → 💵 Accounts → \"🔧 Corrections\" → \"🧮 Summary figures\".","In \"Jisan's savings\" enter what remains after the refund (0 if fully refunded) → \"✓ Save\".","Cash and the liability drop by the same amount and the surplus is unchanged; a voucher is added to the ledger book automatically and the change is in the activity log.","Post a notice if you want members to know."]]},null,null],
["a_role","🗂️","a",{"bn":["ক্যাশিয়ার বদলানো",["অ্যাডমিন প্যানেল → 👥 সদস্য → \"🔐 ব্যবহারকারী ও পাসওয়ার্ড\" → ব্যবহারকারীর পাশে ⚙️।","\"💼 ক্যাশিয়ার বানান\"।","ক্যাশিয়ার একজনই রাখা যায়। \"🗂️ ক্যাশিয়ার নিয়ন্ত্রণ\" কার্ড থেকে ক্যাশিয়ার প্যানেল সাময়িক বন্ধ করা যায়।"]],"en":["Change cashier",["Admin panel → 👥 Members → \"🔐 Users & passwords\" → ⚙️ next to the user.","\"💼 Make cashier\".","Only one cashier at a time. The \"🗂️ Cashier control\" card can pause the cashier panel."]]},null,null],
["a_year","🗓️","a",{"bn":["নতুন বছর শুরু",["জানুয়ারির ১ থেকে ৫ তারিখের মধ্যেই করুন — ৬ তারিখের স্বয়ংক্রিয় জরিমানা নতুন বছর শুরু না হলে অপেক্ষা করে।","আগে পুরো বছরের PDF নামিয়ে রাখুন আর সব পেন্ডিং রিকোয়েস্ট যাচাই করুন।","অ্যাডমিন প্যানেল → ⚙️ সেটিং → \"🗓️ নতুন বছর\" → নিশ্চিত করুন।","চাঁদা, বিশেষ চাঁদা ও জরিমানার রেকর্ড আলাদা ট্যাবে (যেমন Contributions_2026, Special_2026) সংরক্ষণ হয়, এ বছরের মোট আগের বছরের তহবিলে যোগ হয়। কিছুই মোছে না; বাকি জরিমানা বাকিই থাকে।","আগের বছর দেখতে মেনু → \"🗃️ পুরোনো বছর\"।"]],"en":["Start a new year",["Do it between 1 and 5 January — the automatic fine on the 6th waits until the new year is started.","First download the full-year PDF and verify all pending requests.","Admin panel → ⚙️ Settings → \"🗓️ New year\" → confirm.","Contributions, special contributions and fines are saved in separate tabs (e.g. Contributions_2026, Special_2026) and the year's total moves into the previous-years fund. Nothing is deleted; unpaid fines stay due.","To see past years: Menu → \"🗃️ Past years\"."]]},null,null],
["a_bk","💾","a",{"bn":["ব্যাকআপ ও তথ্য ফেরত আনা",["অ্যাডমিন প্যানেল → 🛡️ সিস্টেম → \"💾 দৈনিক ব্যাকআপ\"।","প্রতিদিন রাত ১১টায় (বাংলাদেশ) নিজে থেকে হয়।","শিট, সেটিং ও রশিদের ছবি Drive-এর \"UIF Backup\" ফোল্ডারে থাকে।","গোপন key, লগইন টোকেন ও 2FA কপি হয় না।","শেষ ৩০ দিন + ১২ মাসের মাসিক কপি রাখা হয়; সীমা ৫ GB।","কপি যাচাই হয়; ব্যর্থ হলে অ্যাডমিন নোটিফিকেশন পান।","বড় পরিবর্তনের আগে \"💾 এখনই ব্যাকআপ নিন\" চাপুন।","কিছু মুছে গেলে \"📁 ফোল্ডার খুলুন\" → সেই তারিখের কপি খুলুন।","দরকারি ঘর কপি করে মূল Sheet-এ একই জায়গায় পেস্ট করুন। মূল Sheet মুছবেন না।"]],"en":["Backup & restoring data",["Admin panel → 🛡️ System → \"💾 Daily backup\".","It runs by itself every day at 11 PM (Bangladesh).","The sheet, settings and receipt images go to the Drive folder \"UIF Backup\".","Secret keys, login tokens and 2FA are not copied.","Last 30 days + monthly copies for 12 months are kept; limit 5 GB.","Each copy is checked; the admin is notified if it fails.","Before a big change, tap \"💾 Back up now\".","If something is deleted, tap \"📁 Open folder\" and open that date's copy.","Copy the cells you need into the same place in the main Sheet. Never delete the main Sheet."]]},[["admin:sys","#bkc","এখানে শেষ ব্যাকআপ কবে হয়েছে দেখবেন, চাইলে এখনই ব্যাকআপ নিতে পারবেন।","See when the last backup ran, or back up now."]],null],
["a_push","🔔","a",{"bn":["নোটিফিকেশন সেটআপ (Firebase, একবার)",["কম্পিউটারে console.firebase.google.com খুলে UIF-এর Google অ্যাকাউন্টে লগইন করুন → \"Create a project\" → নাম দিন UIF → Google Analytics বন্ধ রাখুন → Create।","প্রজেক্টের প্রথম পাতায় \"</>\" (Web) আইকন → নাম UIF → \"Register app\" → যে কোড দেখাবে তার \"const firebaseConfig = { … };\" অংশ পুরোটা কপি করুন।","অ্যাপে: অ্যাডমিন প্যানেল → 🛡️ সিস্টেম → \"🔔 ফোনে নোটিফিকেশন\" → ① ঘরে পেস্ট করুন।","Firebase-এ ⚙️ Project settings → \"Cloud Messaging\" ট্যাব → নিচে \"Web Push certificates\" → \"Generate key pair\" → লম্বা key কপি করে ② ঘরে দিন।","Project settings → \"Service accounts\" ট্যাব → \"Generate new private key\" → \"Generate key\" → একটা .json ফাইল নামবে। ③ ঘরে সেই ফাইলটি বাছাই করুন।","\"✓ সেভ\" ক্লিক করুন। \"নোটিফিকেশন চালু আছে\" দেখালে কাজ শেষ — এবার সবাইকে অ্যাপ খুলে \"🔔 চালু করুন\" ক্লিক করতে বলুন।","Service account ফাইলটি গোপন চাবির মতো — কাউকে পাঠাবেন না, সেভ করার পর ফোন/কম্পিউটার থেকে মুছে দিতে পারেন।"]],"en":["Notification setup (Firebase, once)",["On a computer open console.firebase.google.com with the UIF Google account → \"Create a project\" → name it UIF → turn off Google Analytics → Create.","On the project page click the \"</>\" (Web) icon → name UIF → \"Register app\" → copy the whole \"const firebaseConfig = { … };\" part.","In the app: Admin panel → 🛡️ System → \"🔔 Phone notifications\" → paste into box ①.","In Firebase: ⚙️ Project settings → \"Cloud Messaging\" tab → \"Web Push certificates\" → \"Generate key pair\" → copy the long key into ②.","Project settings → \"Service accounts\" tab → \"Generate new private key\" → \"Generate key\" → a .json file downloads. Pick that file in ③.","Click \"✓ Save\". When it says \"Notifications are on\", ask everyone to open the app and click \"🔔 Turn on\".","The service account file is like a secret key — don't share it; you can delete it after saving."]]},[["admin:sys","#npc","এখানে Firebase-এর ৩টি তথ্য দিয়ে সেভ করুন।","Enter the 3 Firebase details here and save."]],null],
["a_pmsg","📨","a",{"bn":["নিজে লিখে নোটিফিকেশন পাঠানো",["অ্যাডমিন প্যানেল → 📣 নোটিশ ও নিয়ম → \"🔔 নোটিফিকেশন পাঠান\"।","শিরোনাম আর বার্তা লিখুন।","\"সবাইকে\" অথবা \"বাছাই করে\" — বাছাই করলে যাঁদের পাঠাবেন তাঁদের টিক দিন। 🔔 চিহ্ন থাকা সদস্যদের ফোনে নোটিফিকেশন চালু আছে।","\"📨 পাঠান\" ক্লিক করুন। উপরে দেখাবে কতজনের ফোনে গেছে।","নতুন নোটিশ, ভোট বা নিয়ম যোগ করলে অ্যাপ নিজেই সবাইকে নোটিফিকেশন পাঠায় — আলাদা করে পাঠাতে হয় না। যিনি পাঠান, তিনিও নিজের ফোনে ও নোটিফিকেশন সেন্টারে পান।","ভুল হলে নিচের \"📤 পাঠানো নোটিফিকেশন\" তালিকায় ✏️ চেপে লেখা বদলান বা 🗑️ চেপে মুছুন — শুধু সবার নোটিফিকেশন সেন্টারে বদলায় (যাঁদের ফোনে আগেই পৌঁছে গেছে, সেখানে নয়)। কোন খবর সদস্যরা বন্ধ করতে পারবেন না, তা 🛡️ সিস্টেম → \"🔒 সবসময় চালু থাকবে যে খবর\"-এ ঠিক করুন।"]],"en":["Sending your own notification",["Admin panel → 📣 Notices & rules → \"🔔 Send notification\".","Write a title and message.","\"Everyone\" or \"Selected\" — tick the people to send to. 🔔 means that member has notifications on.","Click \"📨 Send\". A banner shows how many phones got it.","New notices, votes and rules are notified automatically — no need to send them separately. The sender gets it too, on the phone and in the notification center.","Made a mistake? In the \"📤 Sent notifications\" list below, tap ✏️ to edit or 🗑️ to remove — only in everyone's notification center (not on phones that already got it). Choose which updates members can't turn off in 🛡️ System → \"🔒 Always-on updates\"."]]},[["admin:not","#pmc","এখানে লিখে সবাইকে বা বাছাই করা সদস্যদের পাঠান।","Write here and send to everyone or selected members."]],null],
["a_fgt","🧩","a",{"bn":["অ্যাডমিন নিজের পাসওয়ার্ড ভুলে গেলে",["নিজের Google অ্যাকাউন্ট দিয়ে UIF-এর Google Sheet খুলুন → Users ট্যাবে আপনার সারির C ঘরে নতুন পাসওয়ার্ড লিখুন।","অ্যাপে সেই পাসওয়ার্ড দিয়ে লগইন করুন — সাথে সাথে গোপন হয়ে যাবে; তারপর Authenticator-এর কোড (2FA) লাগবে।","ফোনও না থাকলে ব্যাকআপ কোড দিন, অথবা Apps Script-এ twoFaReset Run করুন (\"দুই ধাপের নিরাপত্তা\" সাহায্য দেখুন)।"]],"en":["Admin forgot own password",["Open the UIF Google Sheet with your Google account → Users tab → type a new password in column C of your row.","Log in with it — it becomes secret at once; then the Authenticator code (2FA) is needed.","Without your phone use a backup code, or run twoFaReset in Apps Script (see the 2FA help)."]]},null,null],
["a_msg","💬","a",{"bn":["মেসেঞ্জার গ্রুপের লিংক বসানো",["Messenger গ্রুপ → গ্রুপের নাম → Invite link কপি করুন।","অ্যাডমিন প্যানেল → ⚙️ সেটিং → সাধারণ তথ্য → লিংকের ঘরে দিন → সেভ।"]],"en":["Set the Messenger group link",["Messenger group → group name → copy the Invite link.","Admin panel → ⚙️ Settings → General info → paste → save."]]},null,null],
["a_sys","🛡️","a",{"bn":["অ্যাডমিন: 🛡️ সিস্টেম ট্যাব",["অ্যাডমিন প্যানেলের \"🛡️ সিস্টেম\" ট্যাবে আছে: 🛠️ রক্ষণাবেক্ষণ, 🛠️ সার্ভার আপডেট, 🔒 সবসময় চালু থাকবে যে খবর, 📊 লগইনের হিসাব, 🔐 দুই ধাপের নিরাপত্তা, 💾 ব্যাকআপ আর 🔔 ফোনে নোটিফিকেশন। কার্যক্রমের লগ মেনুতে।","📊 লগইনের হিসাব: আজ, ৭ দিনে ও ৩০ দিনে কতজন অ্যাপ ব্যবহার করেছেন, প্রত্যেকের শেষ ব্যবহার, সক্রিয় দিন, লগইন সংখ্যা ও ডিভাইস।","৩০ দিনে ব্যবহার না করলে নাম লাল দেখায়।","⚙️ সেটিং ট্যাবে থাকে সাধারণ তথ্য (মেসেঞ্জার লিংক ইত্যাদি), ⭐ মাসিক বিশেষ চাঁদা ও জরিমানার নিয়ম আর 🗓️ নতুন বছর।","🖼️ ছবির স্লাইডার ⚙️ সেটিং ট্যাবে; টাকা পাঠানোর নাম্বার ও 📲 WhatsApp রিমাইন্ডার 🗂️ ক্যাশিয়ার প্যানেলের \"⚙️ অন্যান্য\" ট্যাবে।"]],"en":["Admin: 🛡️ System tab",["The admin tab \"🛡️ System\" has: 🛠️ Maintenance, 🛠️ Server update, 🔒 Always-on alerts, 📊 Login stats, 🔐 2FA, 💾 Backup and 🔔 Phone notifications. The activity log is in the menu.","📊 Login stats: how many used the app today, in 7 and 30 days, and each person's last use, active days, logins and devices.","Names turn red after 30 days without use.","The ⚙️ Settings tab has general info (Messenger link etc.), ⭐ Monthly special contribution & fine rules and 🗓️ New year.","The 🖼️ image slider is in the ⚙️ Settings tab; the payment number and 📲 WhatsApp reminders are in the \"⚙️ Other\" tab of the 🗂️ Cashier panel."]]},null,null],
["jrn","🧾","c",{"bn":["হিসাব খাতা (Debit/Credit)",["মেনু → \"🧾 হিসাব খাতা\" (অ্যাডমিন ও ক্যাশিয়ার দেখতে পান)।","চাঁদা, বিশেষ চাঁদা, জরিমানা, বিনিয়োগ বা আয়-ব্যয়ের যেকোনো entry হলে সিস্টেম নিজে থেকে Debit/Credit লিখে রাখে — আলাদা কিছু করতে হয় না।","ওপরে সবুজ \"✅ সব মিলেছে\" মানে মোট ডেবিট = মোট ক্রেডিট, আর শিটের সঙ্গেও মিল আছে।","\"খাতের ব্যালান্স\"-এ নগদ (ক্যাশিয়ারের হাতে), বিনিয়োগ, জিসানের সঞ্চয়, তহবিল, আয় ও ব্যয়ের খাত আলাদা দেখা যায়। নগদ + বিনিয়োগ = মোট ফান্ড।","\"সাম্প্রতিক ভাউচার\"-এ কে, কখন, কী কারণে কোন খাতে কত টাকা গেল তা দেখা যায়। এখান থেকে কিছু মোছা যায় না।","কেউ Google Sheet-এ সরাসরি অঙ্ক বদলালে এক ঘণ্টার মধ্যে \"শিটে সরাসরি বদল ধরা পড়েছে\" ভাউচার পড়ে যায়।"]],"en":["Journal (Debit/Credit)",["Menu → \"🧾 Journal\" (admin and cashier can see it).","Whenever a contribution, special contribution, fine, investment or ledger entry is made, the system writes the Debit/Credit itself — nothing extra to do.","A green \"✅ All balanced\" means total debit = total credit and it matches the sheet.","\"Account balances\" shows cash (with the cashier), investments, Jisan's savings, fund, income and expense accounts. Cash + investments = total fund.","\"Recent vouchers\" shows who moved how much into which account, when and why. Nothing can be deleted here.","If someone edits a figure directly in the Google Sheet, a \"direct sheet edit detected\" voucher is posted within an hour."]]},null,null],
["a_spc","⭐","a",{"bn":["অ্যাডমিন: বিশেষ ও অতিরিক্ত চাঁদা",["সদস্যের চোখে প্রতি মাসের চাঁদা একটাই সংখ্যা = নিয়মিত (নাম × ১,০০০) + সেই মাসের বিশেষ চাঁদা (হার থাকলে)। ছকে মোটটা দেখায়, নিচে ছোট করে ভাগ।","সদস্য বা ক্যাশিয়ার মাস বেছে টাকা দিলে অ্যাপ নিজেই নিয়মিত আর বিশেষে ভাগ করে।","অ্যাডমিন প্যানেল → 💵 হিসাব → \"🔧 সংশোধন\" → \"⭐ বিশেষ / অতিরিক্ত চাঁদা যোগ\": মাস দিলে সেই মাসের বিশেষ অংশ, মাস না দিলে \"➕ অতিরিক্ত চাঁদা\"।","অতিরিক্ত চাঁদা = কোনো মাসের সঙ্গে যুক্ত নয় এমন বাড়তি জমা — সদস্যের কার্ড, \"👤 আমার হিসাব\" আর বিবরণীতে আলাদা লাইনে দেখায়।","হিসাব খাতা, Balance Sheet আর আয়-ব্যয়ে \"নিয়মিত চাঁদা\" ও \"বিশেষ চাঁদা\" (মাসের বিশেষ + অতিরিক্ত) আলাদাই থাকে — হিসাবের নিয়মে দরকার।","ভুল হলে তালিকার ↩️ চেপে কারণ লিখে বাতিল করুন।"]],"en":["Admin: special & extra contributions",["Members see one number per month = regular (shares × 1,000) + that month's special (if a rate is set). The grid shows the total with a small breakdown.","When a member or cashier pays for a month, the app splits it into regular and special.","Admin panel → 💵 Accounts → \"🔧 Corrections\" → \"⭐ Add special / extra contribution\": with a month it is that month's special part; without a month it is a \"➕ Extra contribution\".","Extra contribution = deposit not tied to any month — shown on its own line on the member card, \"👤 My account\" and the statement.","The journal, balance sheet and income-expense keep \"regular\" and \"special\" (monthly special + extra) separate, as accounting requires.","If wrong, tap ↩️ in the list and give a reason to void it."]]},null,null],
["a_void","↩️","a",{"bn":["অ্যাডমিন: মোছার বদলে বাতিল",["টাকার কোনো রেকর্ড (জরিমানা, বিনিয়োগ, আয়-ব্যয়, বিশেষ চাঁদা, টাকার রিকোয়েস্ট) আর মোছা যায় না — 🗑️-এর জায়গায় এখন ↩️ বাতিল।","↩️ চাপলে কারণ জানতে চাইবে — কমপক্ষে ৩ অক্ষর লিখে OK দিন।","রেকর্ডটি Google Sheet-এর \"Voided\" ট্যাবে কারণ, সময় আর কে বাতিল করলেন সহ থেকে যায়।","হিসাব খাতায় উল্টো ভাউচার পড়ে, তাই মোট ফান্ড সঙ্গে সঙ্গে ঠিক হয়ে যায়।","চাঁদার ছকের ভুল ঠিক করতে আগের মতোই 💵 হিসাব → \"🔧 সংশোধন\" → \"💵 জমা এন্ট্রি\"-তে সঠিক অঙ্ক দিন — পুরোনো আর নতুন অঙ্কের পার্থক্য হিসাব খাতায় থাকে।"]],"en":["Admin: Void instead of delete",["Money records (fines, investments, ledger, special contributions, payment requests) can no longer be deleted — 🗑️ is now ↩️ Void.","Tapping ↩️ asks for a reason — write at least 3 characters and tap OK.","The record stays in the Google Sheet's \"Voided\" tab with the reason, time and who voided it.","A reverse voucher is posted in the journal, so the total fund is corrected at once.","To fix the contribution grid, enter the correct amount in 💵 Accounts → \"🔧 Corrections\" → \"💵 Deposit entry\" as before — the difference stays in the journal."]]},null,null],
["a_tr","🔁","a",{"bn":["অ্যাডমিন: শেয়ার (নাম) হস্তান্তর",["অ্যাডমিন প্যানেল → 👥 সদস্য → \"🔁 শেয়ার (নাম) হস্তান্তর\"।","দাতা, গ্রহীতা (বর্তমান সদস্য বা নতুন ব্যক্তি), কয়টি নাম, কোন মাস থেকে আর কারণ লিখে \"🔁 হস্তান্তর করুন\" চাপুন — নিশ্চিত করার বার্তা আসবে।","আংশিক চলে (যেমন ২টির ১টি নাম)। দাতার আগের জমা নাম সংখ্যার অনুপাতে নতুন মালিকের হিসাবে যায়; টাকার লেনদেন দুজনের মধ্যে, ফান্ডে কোনো বদল হয় না।","যে মাস থেকে হস্তান্তর, সেই মাসের চাঁদা নতুন মালিক দেবেন; আগের মাসগুলোর নির্ধারিত চাঁদা পুরোনো নাম সংখ্যায় থাকে। দাতার বকেয়া চাঁদা/জরিমানা দাতারই থাকে।","সব নাম দিলে দাতা প্রাক্তন সদস্য (X-আইডি) হন, লগইন বন্ধ হয়। নতুন ব্যক্তি সদস্য হন (পরের M-আইডি) — তাঁর লগইন 🔐 ব্যবহারকারী থেকে খুলুন।","ভুল হলে রেকর্ডের পাশে ↩️ বাতিল (শুধু সবশেষটি, কারণসহ) — সব আগের অবস্থায় ফেরে।"]],"en":["Admin: Share transfer",["Admin panel → 👥 Members → \"🔁 Share transfer\".","Choose the giver, the receiver (existing member or new person), how many shares, from which month and a reason, then tap \"🔁 Transfer\" — a confirmation appears.","Partial transfers work (e.g. 1 of 2 shares). The giver's past deposits move to the new owner in proportion to shares; money changes hands between the two, the fund does not change.","The new owner pays from the transfer month; earlier months keep the old share count. The giver's unpaid dues/fines stay with the giver.","If all shares are given, the giver becomes a former member (X-ID) and login is closed. A new person becomes a member (next M-ID) — open their login under 🔐 Users.","If it was a mistake, use ↩️ Void next to the record (latest one only, with a reason) — everything goes back."]]},null,null],
["inv2","📈","g",{"bn":["গিরবি ও বিনিয়োগের হিসাব",["মেনু → \"📈 বিনিয়োগ\"।","প্রতিটি গিরবির কার্ডে জমির মালিক, জমির পরিমাণ, তারিখ আর মেয়াদ দেখা যায়। তারিখ বা মেয়াদ জানা না থাকলে \"তারিখ জানা নেই\" / \"মেয়াদ নির্দিষ্ট নেই\" লেখা থাকে।","মেয়াদ বসানো থাকলে কত দিন বাকি তা দেখায়; ৩০ দিনের কম হলে লাল রঙে।","নিচের \"✨ লাভের হিসাব\"-এ কোন গিরবি থেকে কত লাভ এসেছে দেখা যায়। আগের লাভ কোনটি থেকে কত তা জানা নেই, তাই \"দুই গিরবি মিলিয়ে\" আলাদা লাইনে আছে।","জমি ফেরত দেওয়া হলে কার্ডে \"🔙 ফেরত\" দেখায় আর সেই টাকা আবার নগদে যোগ হয়।"]],"en":["Mortgages & investments",["Menu → \"📈 Investments\".","Each mortgage card shows the land owner, land size, date and term. If unknown it says \"Date unknown\" / \"No fixed term\".","With a term set it shows the days left — red when under 30 days.","\"✨ Profit\" below shows how much profit came from which mortgage. The split of earlier profit is unknown, so it has its own \"both mortgages\" line.","When land is returned the card shows \"🔙 Returned\" and that money is added back to cash."]]},null,null],
["bs","⚖️","g",{"bn":["Balance Sheet ও মাসিক আয়-ব্যয়",["মেনু → \"📄 PDF রিপোর্ট\" → নিচের \"⚖️ Balance Sheet ও আয়-ব্যয়\"।","Balance Sheet: ওপরে ফাউন্ডেশনের কী আছে (নগদ + প্রতিটি গিরবি), নিচে তা কোথা থেকে এসেছে (জিসানের সঞ্চয়, আগের বছরের তহবিল, এ বছরের উদ্বৃত্ত)। দুই দিকের মোট সবসময় সমান = মোট ফান্ড।","মাসিক আয়-ব্যয়: প্রতি মাসে কত আয় (চাঁদা, বিশেষ চাঁদা, জরিমানা, লাভ) আর কত ব্যয় হলো, আর নিট কত।","💵 নগদ মিলানো: শুরুর তহবিল + আয় − ব্যয় + জিসানের সঞ্চয় − বিনিয়োগে দেওয়া + ফেরত = শেষের নগদ। ক্যাশিয়ারের গুনে পাওয়া টাকা লিখলে ✅ বা কম/বেশি দেখায়।","\"📄 PDF তৈরি করুন\" চাপলে সব একসাথে PDF হয় — শেয়ার বা ডাউনলোড করা যায়।"]],"en":["Balance sheet & monthly income-expense",["Menu → \"📄 PDF report\" → \"⚖️ Balance Sheet & income-expense\" below.","Balance sheet: what the foundation has (cash + each mortgage) on top, and where it came from (Jisan's savings, previous years' fund, this year's surplus) below. Both totals always equal the total fund.","Monthly income-expense: income (contributions, special, fines, profit), expense and net for each month.","💵 Cash reconciliation: opening fund + income − expense + Jisan's savings − invested + returned = closing cash. Enter the cashier's counted cash to see ✅ or short/extra.","\"📄 Create PDF\" makes all of it into one PDF to share or download."]]},null,null],
["a_inv","🔙","a",{"bn":["অ্যাডমিন: গিরবি রেজিস্টার, ফেরত ও লাভ",["অ্যাডমিন প্যানেল → 💵 হিসাব → বিনিয়োগ। ✏️ চেপে জমির মালিক, জমির পরিমাণ, তারিখ আর মেয়াদ বসান — সবই ঐচ্ছিক, পরে জানলে বসালেও চলবে।","মেয়াদ বসালে শেষ হওয়ার ৩০, ৭ ও ১ দিন আগে আর শেষ দিনে অ্যাডমিন নোটিফিকেশন পাবেন।","জমি ফেরত দিলে \"🔙 ফেরত\" চাপুন ও তারিখ দিন — মূলধন নিজে থেকে নগদে ফেরত আসে, হিসাব খাতায় লেখা হয়। ভুল হলে \"↺ আবার চালু\"।","গিরবির লাভ পেলে: 📒 আয়-ব্যয় → ধরন \"আয়\" → খাত \"লাভ প্রাপ্তি\" → \"কোন বিনিয়োগ থেকে\" বাছাই করুন। তাহলে সেই গিরবির কার্ডে লাভ দেখাবে।","ভুল করে যোগ হওয়া বিনিয়োগ ↩️ চেপে কারণসহ বাতিল করুন (ফেরত আর বাতিল আলাদা — ফেরত মানে গিরবি শেষ হয়েছে)।"]],"en":["Admin: mortgage register, returns & profit",["Admin panel → 💵 Accounts → Investments. Tap ✏️ to set land owner, size, date and term — all optional, fill in later if you learn them.","With a term set, the admin gets a notification 30, 7 and 1 days before and on the last day.","When land is returned tap \"🔙 Returned\" and give the date — the principal returns to cash automatically and is recorded in the journal. Mistake? \"↺ Reopen\".","When mortgage profit arrives: 📒 Ledger → type \"Income\" → category \"লাভ প্রাপ্তি\" → choose \"From which investment\". The profit then shows on that mortgage's card.","An investment added by mistake: tap ↩️ and give a reason to void (returned ≠ void — returned means the mortgage ended)."]]},null,null],
["nfc","📬","g",{"bn":["নোটিফিকেশন সেন্টার (📬)",["ওপরের 🔔 বা মেনু → \"📬 নোটিফিকেশন সেন্টার\"।","আপনার কাছে যত নোটিফিকেশন এসেছে (নোটিশ, ভোট, টাকা জমা, জরিমানা, মনে করিয়ে দেওয়া) সব এখানে তারিখ অনুযায়ী থাকে — ফোনে নোটিফিকেশন বন্ধ থাকলেও।","না-পড়াগুলো হলুদ রঙে আর পাশে বিন্দু দিয়ে দেখায়; 🔔-এর ওপরের সংখ্যাও না-পড়া নোটিফিকেশনের।","কোনো নোটিফিকেশনে চাপ দিলে সেটি \"পড়া\" হয়ে যায় আর সংশ্লিষ্ট পাতা খোলে। একসাথে সব পড়া করতে \"সব পড়া হয়েছে\"।","\"না-পড়া\" ট্যাবে শুধু না-পড়াগুলো দেখা যায়। ওপরের \"📌 করণীয়\"-তে বাকি ভোট, নতুন নোটিশ ইত্যাদি থাকে।","\"✕ সরান\" চাপলে শুধু আপনার তালিকা থেকে সরে — অন্যদের তালিকায় থাকে। অ্যাডমিন \"🗑️ সবার থেকে মুছুন\" দিয়ে সবার তালিকা থেকে মুছতে পারেন; ফোনে আগেই পৌঁছানোটা ফেরানো যায় না।"]],"en":["Notification Center (📬)",["Tap 🔔 at the top or Menu → \"📬 Notification Center\".","Every notification you received (notices, votes, payments, fines, reminders) is kept here by date — even if phone notifications are off.","Unread ones are highlighted with a dot; the number on 🔔 is your unread count.","Tap a notification to mark it read and open its page. \"Mark all read\" clears them all.","The \"Unread\" tab shows only unread ones. \"📌 To do\" lists pending votes, new notices and so on.","\"✕ Remove\" takes it off your list only — others still see it. The admin can use \"🗑️ Delete for all\"; what already reached a phone cannot be taken back."]]},null,null],
["a_tfa","🔐","a",{"bn":["অ্যাডমিন: দুই ধাপের নিরাপত্তা (2FA)",["অ্যাডমিন লগইনে পাসওয়ার্ডের পর ফোনের Authenticator অ্যাপের ৬ অঙ্কের কোড লাগে — পাসওয়ার্ড কেউ জানলেও ঢুকতে পারবে না।","প্রথমবার: অ্যাপ নিজেই \"🔐 দুই ধাপের নিরাপত্তা\" পাতা খুলবে → \"শুরু করুন\" → \"📲 Authenticator-এ যোগ করুন\" (না খুললে গোপন চাবি কপি করে Authenticator-এ ＋ → Enter a setup key) → ৬ অঙ্কের কোড লিখে \"2FA চালু করুন\"।","এরপর ৮টি ব্যাকআপ কোড দেখাবে — স্ক্রিনশট নিন বা লিখে রাখুন। প্রতিটি একবারই চলে, ফোন না থাকলে কাজে লাগবে।","প্রতিবার লগইন: পাসওয়ার্ড → Authenticator-এ UIF-এর এখনকার কোড লিখে \"যাচাই করুন\"।","🛡️ সিস্টেম → \"🔐 দুই ধাপের নিরাপত্তা\"-তে কয়টি ব্যাকআপ কোড বাকি দেখা যায়; \"🔄 নতুন ব্যাকআপ কোড\" দিয়ে নতুন নেওয়া যায়।","ফোন হারালে: ব্যাকআপ কোড দিয়ে ঢুকুন, কোডও না থাকলে Apps Script-এ twoFaReset বেছে Run করুন।"]],"en":["Admin: Two-step security (2FA)",["Admin login needs a 6-digit code from the phone's Authenticator app after the password — a leaked password alone is not enough.","First time: the app opens \"🔐 Two-step security\" → \"Start\" → \"📲 Add to Authenticator\" (or copy the secret key: Authenticator ＋ → Enter a setup key) → enter the 6-digit code → \"Turn on 2FA\".","8 backup codes are shown — screenshot or write them down. Each works once, for when the phone is not at hand.","Every login: password → current UIF code from Authenticator → \"Verify\".","🛡️ System → \"🔐 Two-step security\" shows backup codes left; \"🔄 New backup codes\" makes new ones.","Lost phone: use a backup code. Without a code, run twoFaReset in Apps Script."]]},null,null],
["a_log","📝","a",{"bn":["অ্যাডমিন: কার্যক্রমের লগ",["মেনু → \"📝 কার্যক্রমের লগ\"।","কে, কখন, কী বদলেছেন — টাকা এন্ট্রি, জরিমানা, বিনিয়োগ, সদস্য, নোটিশ, পাসওয়ার্ড, 2FA — সব তারিখ অনুযায়ী দেখা যায়।","ওপরের ঘরে নাম, কাজ বা টাকার অঙ্ক লিখে 🔍 চাপলে খুঁজে দেয়।","\"👤 সবাই\" থেকে একজন ব্যক্তি বাছলে শুধু তাঁর কাজ; 💵 টাকা / 📈 বিনিয়োগ / 👥 সদস্য / 📣 নোটিশ / 🛡️ সিস্টেম চাপলে শুধু সেই ধরনের কাজ।","একবারে ৪০টি দেখায়; নিচে \"আরও দেখুন\" চাপলে আরও আসে। 🔄 দিয়ে নতুন করে আনা যায়।"]],"en":["Admin: Activity log",["Menu → \"📝 Activity log\".","Who changed what and when — money entries, fines, investments, members, notices, passwords, 2FA — all by date.","Type a name, action or amount and tap 🔍 to search.","Pick a person from \"👤 Everyone\" to see only their actions; tap 💵 Money / 📈 Investments / 👥 Members / 📣 Notices / 🛡️ System to filter by type.","40 are shown at a time; \"Show more\" loads more. 🔄 refreshes."]]},null,null],
["a_ival","💹","a",{"bn":["অ্যাডমিন: গিরবির বর্তমান মূল্য",["অ্যাডমিন প্যানেল → 💵 হিসাব → বিনিয়োগ তালিকায় গিরবির পাশে \"💹 মূল্য\"।","এখনকার আনুমানিক বাজারমূল্য লিখুন, তারপর কবে যাচাই করেছেন সেই তারিখ (খালি রাখলে আজ)।","এই মূল্য শুধু দেখানো হয় — মোট ফান্ড, Balance Sheet ও হিসাব খাতায় মূলধনই থাকে; জমি ফেরত হলে মূলধন নগদে আসে।","\"📈 বিনিয়োগ\" পাতায় প্রতিটি কার্ডে লাভ/ক্ষতি %, শেষ হালনাগাদের তারিখ আর \"মূল্যের ইতিহাস\" দেখা যায়। ৬ মাসের বেশি পুরোনো হলে লাল লেখা মনে করিয়ে দেয়।"]],"en":["Admin: Current value of mortgages",["Admin panel → 💵 Accounts → in the investment list tap \"💹 Value\" next to a mortgage.","Enter the estimated current market value, then the date it was checked (empty = today).","This value is display only — total fund, Balance Sheet and the journal keep the capital; when land is returned the capital comes back as cash.","On \"📈 Investments\" each card shows gain/loss %, the last update date and \"Value history\". A red note appears if it is older than 6 months."]]},null,null],
["photo","📷","g",{"bn":["নিজের ছবি দেওয়া",["মেনু → \"👤 আমার হিসাব\" → \"📷 আমার ছবি\" → \"🖼️ ছবি দিন\"।","ছবি বাছলে গোল করে কাটা একটি নমুনা দেখাবে — পছন্দ হলে \"✓ রাখুন\"।","ছবিটি অনলাইন তালিকা, সদস্য পাতা, পেমেন্ট কার্ডসহ সব জায়গায় আপনার নামের পাশে দেখাবে। বদলাতে \"বদলান\", সরাতে \"ছবি সরান\"।","ছবি না দিলে একটি যুবকের কার্টুন avatar দেখায়। অনুপযুক্ত ছবি অ্যাডমিন সরিয়ে দিতে পারেন।","কার্টুন avatar-এর নকশা: ToonHead — Johan Melin (CC BY 4.0), DiceBear দিয়ে তৈরি।"]],"en":["Adding your photo",["Menu → \"👤 My account\" → \"📷 My photo\" → \"🖼️ Add photo\".","A round preview appears — tap \"✓ Use it\" if you like it.","Your photo shows next to your name everywhere: online list, members, payment cards. Use \"Change\" or \"Remove photo\" any time.","Without a photo a young cartoon avatar is shown. The admin can remove an unsuitable photo.","Cartoon avatar design: ToonHead by Johan Melin (CC BY 4.0), made with DiceBear."]]},null,null],
["app2","📲","g",{"bn":["অ্যাপ বসানো ও নতুন সংস্করণ",["Android: Chrome-এর মেনু (⋮) → \"Install app\" বা \"Add to Home screen\"।","iPhone: Safari-তে খুলে নিচের Share ⬆️ → \"Add to Home Screen\" → \"Add\"। আইফোনে নোটিফিকেশন শুধু হোম স্ক্রিনের অ্যাপ থেকেই আসে।","আইফোনে Safari-তে খুললে ধাপগুলো ছবিসহ নিজে থেকে দেখাবে। \"পরে\" চাপলে ৭ দিন পর আবার দেখাবে।","অ্যাপের নতুন সংস্করণ এলে নিচে \"🎉 অ্যাপের নতুন সংস্করণ এসেছে\" বার্তা আসবে — \"আপডেট করুন\" চাপলেই নতুনটা খুলবে।","কোনো বোতাম চাপার পর কাজ শেষ না হওয়া পর্যন্ত সেটি একটু ঝাপসা থাকে — একবার চাপলেই যথেষ্ট, বারবার চাপতে হবে না।"]],"en":["Installing the app & new versions",["Android: Chrome menu (⋮) → \"Install app\" or \"Add to Home screen\".","iPhone: open in Safari, tap Share ⬆️ at the bottom → \"Add to Home Screen\" → \"Add\". On iPhone, notifications only come to the Home Screen app.","On iPhone in Safari, the steps show by themselves with pictures. Tap \"Later\" and they show again after 7 days.","When a new version is out, \"🎉 A new version of the app is ready\" shows at the bottom — tap \"Update\" to open it.","After you tap a button it stays faded until the work is done — one tap is enough, no need to tap again."]]},null,null],
["dev2","📱","g",{"bn":["লগইন, ডিভাইস ও অ্যাকাউন্ট বন্ধ থাকলে",["একই অ্যাকাউন্টে একসাথে সর্বোচ্চ ২টি ডিভাইসে (যেমন ফোন ও কম্পিউটার) লগইন থাকা যায়।","৩য় কোনো ডিভাইসে লগইন করলে সবচেয়ে পুরোনো ডিভাইস থেকে নিজে থেকে বের হয়ে যাবে — সেখানে বার্তা দেখাবে।","হারানো ফোনে বা অন্যের ফোনে লগইন রয়ে গেলে অ্যাডমিনকে বলুন — তিনি দূর থেকে সেই ডিভাইস থেকে বের করে দিতে পারবেন।","অ্যাকাউন্ট সাময়িক স্থগিত হলে লগইনের সময় কারণ ও শেষ তারিখ দেখাবে। শেষ তারিখ পার হলে নিজে থেকে আবার চালু হবে।","\"🛠️ রক্ষণাবেক্ষণ চলছে\" দেখালে কিছু করতে হবে না — কাজ শেষ হলে অ্যাপ নিজে থেকে খুলে যাবে।"]],"en":["Login, devices & blocked accounts",["One account can stay logged in on up to 2 devices at a time (e.g. phone and computer).","Logging in on a 3rd device logs out the oldest one automatically — it shows a message there.","If you are still logged in on a lost phone or someone else's phone, tell the admin — they can log that device out remotely.","If your account is temporarily suspended, the reason and end date show at login. It reopens by itself after the end date.","If \"🛠️ Under maintenance\" shows, just wait — the app opens by itself when the work is done."]]},null,null],
["a_mnt","🛠️","a",{"bn":["অ্যাডমিন: রক্ষণাবেক্ষণ (Maintenance)",["অ্যাডমিন প্যানেল → 🛡️ সিস্টেম → \"🛠️ রক্ষণাবেক্ষণ\"।","বার্তা লিখে (খালি রাখলে সাধারণ বার্তা) \"রক্ষণাবেক্ষণ চালু করুন\" দিন।","চালু থাকলে শুধু অ্যাডমিন ঢুকতে পারবেন; ক্যাশিয়ার ও সদস্যরা বার্তা দেখবেন — খোলা অ্যাপেও এক-দুই মিনিটের মধ্যে।","চালু থাকা অবস্থায় ওপরে লাল দাগ মনে করিয়ে দেবে। কাজ শেষে \"রক্ষণাবেক্ষণ বন্ধ করুন\" — সবার অ্যাপ নিজে থেকে খুলবে।","কবে কে চালু/বন্ধ করলেন তা কার্যক্রমের ইতিহাসে থাকে।"]],"en":["Admin: Maintenance",["Admin panel → 🛡️ System → \"🛠️ Maintenance\".","Write a message (leave empty for the default) and tap \"Turn on maintenance\".","While on, only the admin can get in; cashier and members see the message — even in an open app within a minute or two.","A red strip at the top reminds you it is on. When done, tap \"Turn off maintenance\" — everyone's app opens by itself.","Who turned it on/off and when is kept in the activity log."]]},null,null],
