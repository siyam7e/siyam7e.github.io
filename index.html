const stamp=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function monthlyPDF(){const ms=[...sel].sort((a,b)=>a-b);if(!ms.length)return alert(t("nosel"));makePDF(monthSecs(ms),`UIF_Monthly_${ms.map(i=>MNE[i]).join("-")}_${new Date().getFullYear()}.pdf`)}
